  <!-- ================================================================
       FILE: dt_thung_lung.html
       CHỨC NĂNG: TRANG GAME thung lũng 3D của Đấu Trường Tri Thức: bé bấm "▶️ Tiếp tục" ở sảnh
                  (dautruongtrithuc.html) là vào đây. Thung Lũng Khởi Đầu 128 x 128 có sương mù:
                  lần đầu Thủ lĩnh ở cổng thung lũng, bé chạm chỗ đất xanh để dựng Lều trại, dựng
                  xong có nông dân đi làm; chạm chỗ tối hoặc bấm "🔭 Đi khám phá" để nông dân mở
                  đất mới. Làng lưu trên máy chủ Supabase (TC_D02B3a: bản đồ chung nhiều bé, đổi máy
                  vẫn còn). Cần đăng nhập + đã tạo Thủ lĩnh (chưa thì tự về sảnh). Không có nút thử
                  (trang thử: dt_thu_3d.html?vung, máy chủ giả trên máy).
                  TC_D06A: quái lang thang (dt/dt_quai_ban_do.js + dt/3d/dt3d_quai_ban_do.js); chọn Thủ lĩnh
                  chạm quái -> màn chiến đấu phủ lên trang (khung dt/thu_tran_dau.html?nhung=1).
       BƯỚC: TC_D02B2b; TC_D02B3a (máy chủ Supabase); TC_D06A (quái trên bản đồ)
       NGÀY: 27/10/2026; 27/10/2026 18:55; 30/10/2026
       PHỤ THUỘC: supabase-js@2 (CDN, như cả app), kc_config.js, kc_api.js,
                  thu_vien/three (Three.js r170, MIT), chung/nv_ve.js, chung/nv_ho_so.js,
                  dt/dt_tien_do.js, dt/dt_luoi.js, dt/dt_lang.js, dt/dt_ban_do.js, dt/dt_may_chu.js,
                  dt/dt_may_chu_sb.js,
                  dt/3d/dt3d.css, dt/3d/*.js (khởi động: dt/3d/dt3d_thu.js chế độ game),
                  dt/mo_hinh/*.glb (KayKit, CC0), dt/du_lieu/vung_dat.json, dt/du_lieu/cau_hinh.json;
                  phiên đăng nhập (sessionStorage) do kc_auth.js của sảnh ghi
       ================================================================ -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dt/3d/dt3d.css">
  <script type="importmap">
    { "imports": { "three": "./thu_vien/three/three.module.min.js" } }
  </script>
</head>
<body data-che-do="game">
  <div id="d3Canh" aria-label="Thung lũng 3D: kéo để xem, chạm để chọn và ra lệnh"></div>
  <div id="d3ChuNoi"></div>

  <div class="d3Tren">
    <a class="d3Nut d3Khung" href="dautruongtrithuc.html" aria-label="Về sảnh Đấu Trường">⬅</a>
    <div class="d3Ten d3Khung" id="d3TenVuong">Thung Lũng Khởi Đầu</div>
    <div class="d3Kho d3Khung" aria-label="Tài nguyên">
      <span class="d3Tn" title="Gỗ">🪵 <b id="d3Go">0</b></span>
      <span class="d3Tn" title="Đá">🪨 <b id="d3Da">0</b></span>
      <span class="d3Tn" title="Vàng">🪙 <b id="d3Vang">0</b></span>
      <span class="d3Tn" id="d3SatO" title="Sắt" hidden>⛓️ <b id="d3Sat">0</b></span><!-- 06/11/2026 TC_D06C4: Sắt (quái rơi) hiện khi bé có -->
      <span class="d3Tn" title="Lương thực">🍖 <b id="d3Lt">0</b></span>
      <span class="d3Tn d3DanSo" id="d3DanSo" title="Dân + quân / tối đa" hidden>👥 <b id="d3DanSoSo">0/0</b></span><!-- 05/11/2026 TC_D06C2d: dân số lên thanh trên -->
    </div>
  </div>

  <!-- TC_D06D: thanh điều khiển cuối màn hình (đang xem | lệnh | chung), dt/3d/dt3d_thanh_duoi.js.
       Bấm thứ gì có thông số / thao tác được thì thông số hiện ở ô trái, nút làm được hiện ở ô giữa. -->
  <div class="d3Duoi">
    <div class="d3Khung" id="d3GoiY" role="status" aria-live="polite">Đang dựng thung lũng…</div>
    <div class="d3Thanh">
      <section class="d3BangChon" aria-label="Đang xem" aria-live="polite">
        <div class="d3BangAnh" id="d3BangAnh" aria-hidden="true">🏰</div>
        <div class="d3BangThongTin">
          <strong id="d3BangTen">Làng</strong>
          <span id="d3BangDong" hidden></span>
          <span id="d3BangPhu" hidden></span>
          <div class="d3BangMuc" id="d3BangMuc" hidden><i id="d3BangMucDay"></i></div>
        </div>
      </section>
      <div class="d3Lenh" id="d3Lenh" aria-label="Lệnh">
        <span class="d3LenhRieng" id="d3LenhRieng"></span>
        <button class="d3Nut d3Khung" id="d3SoiDat" type="button" aria-label="Chọn chỗ dựng Lều trại" aria-pressed="false" hidden>🏕️<span class="d3Chu"> Dựng lều</span></button>
        <button class="d3Nut d3Khung" id="d3KhamPhaNut" type="button" aria-label="Nông dân đi khám phá" hidden>🔭<span class="d3Chu"> Đi khám phá</span></button>
        <!-- Nút thử (dt3d_thu.js cần có phần tử, trang game luôn ẩn) -->
        <button class="d3Nut d3Khung" id="d3DoiHinh" type="button" hidden>🎨</button>
        <button class="d3Nut d3Khung" id="d3ThuTran" type="button" hidden>⚔️</button>
        <button class="d3Nut d3Khung" id="d3Tua" type="button" hidden>⏩</button>
        <button class="d3Nut d3Khung" id="d3ThemNd" type="button" hidden>➕ <span id="d3SoNd">0</span></button>
        <button class="d3Nut d3Khung" id="d3LamLai" type="button" hidden>🔄</button>
      </div>
      <div class="d3Chung" aria-label="Cả làng">
        <span class="d3Khung d3Do" id="d3Fps">… khung/giây</span>
        <button class="d3Nut d3Khung" id="d3VeLang" type="button" aria-label="Về chỗ Thủ lĩnh">👑<span class="d3Chu"> Về Thủ lĩnh</span></button>
        <button class="d3Nut d3Khung" id="d3DoHoa" type="button">✨ Đồ họa: Đẹp</button>
      </div>
    </div>
  </div>

  <div id="d3Tai"><div id="d3TaiChu">Đang dựng thung lũng…</div></div>

  <script src="chung/nv_ve.js"></script>
  <script src="chung/nv_ho_so.js"></script>
  <script src="dt/dt_tien_do.js"></script>
  <script src="dt/dt_luoi.js"></script>
  <script src="dt/dt_lang.js"></script>
  <script src="dt/dt_ban_do.js"></script>
  <script src="dt/dt_may_chu.js"></script>
  <script src="dt/dt_quai_ban_do.js"></script>
  <script src="dt/dt_quai.js"></script>
  <script src="dt/dt_roi_do.js"></script> <!-- TC_D06C4: quái rơi đồ -->
  <script src="dt/dt_tran_dau.js"></script>
  <script src="dt/dt_dan_danh.js"></script> <!-- TC_D06C2b: nông dân tự đánh quái -->
  <script src="dt/dt_tru_tran.js"></script> <!-- TC_D06C2g: trụ phòng thủ (luật + chọn câu cho trụ) -->
  <script src="dt/dt_trinh_do.js"></script>
  <script src="dt/dt_sinh_toan.js"></script>
  <script src="dt/dt_sinh_tieng_anh.js"></script>
  <script src="dt/dt_cau_hoi.js"></script>
  <script src="dt/dt_thu_vien_cau.js"></script> <!-- TC_D06E: thư viện câu hỏi (📝 Cập nhật câu hỏi) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="kc_config.js"></script>
  <script src="kc_api.js"></script>
  <script src="dt/dt_may_chu_sb.js"></script>
  <script src="dt/dt_cau_hinh.js"></script> <!-- TC_D18A: số mặc định + phần quản trị đã sửa -->
  <script type="module" src="dt/3d/dt3d_thu.js"></script>
</body>
</html>
