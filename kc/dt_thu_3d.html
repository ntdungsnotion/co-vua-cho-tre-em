<head>

  <title>Làng 3D (thử) - Đấu Trường Tri Thức</title>

  <!-- ================================================================
       FILE: dt_thu_3d.html
       CHỨC NĂNG: Trang THỬ cảnh 3D kiểu Đế Chế của Đấu Trường Tri Thức (mở bằng địa chỉ, không có
                  nút dẫn tới). Toàn màn hình: cảnh 3D + thanh tài nguyên + gợi ý + nút đồ họa Đẹp /
                  Nhẹ + số khung hình. Không cần đăng nhập: ngoại hình Thủ lĩnh đọc hồ sơ chung có
                  sẵn trên máy.
                  - mặc định: làng mẫu. Thử nhiều nông dân: thêm ?nd=20. Nút "Tua 3 giờ" xem cây / mỏ /
                    cá / bụi mọc lại.
                  - ?vung: THUNG LŨNG KHỞI ĐẦU 128 x 128 có sương mù, y như trang game
                    dt_thung_lung.html (dựng lều, nông dân khám phá) cộng nút thử; "🔄 Vào lại" xoá
                    hết để vào lại từ đầu.
       BƯỚC: TC_D01C; TC_D02A (lõi dt_lang.js + phần vẽ tách từng phần dt/3d/, 4 loại tài nguyên);
             TC_D02B2a (thung lũng ?vung: sương mù, soi đất, lớp máy chủ);
             TC_D02B2b (giao diện sang dt/3d/dt3d.css dùng chung với trang game; nút 🏕️ dựng lều, 🔭 khám phá)
       NGÀY: 23/10/2026; 26/10/2026; 27/10/2026
       PHỤ THUỘC: thu_vien/three (Three.js r170, MIT), chung/nv_ve.js, dt/dt_luoi.js, dt/dt_lang.js,
                  dt/dt_ban_do.js, dt/dt_may_chu.js, dt/3d/dt3d.css,
                  dt/3d/*.js (khởi động: dt/3d/dt3d_thu.js), dt/mo_hinh/*.glb (KayKit, CC0),
                  dt/du_lieu/lang_thu_3d.json, dt/du_lieu/vung_dat.json, dt/du_lieu/cau_hinh.json
       ================================================================ -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dt/3d/dt3d.css">
  <script type="importmap">
    { "imports": { "three": "./thu_vien/three/three.module.min.js" } }
  </script>
</head>
<body>
  <div id="d3Canh" aria-label="Thung lũng 3D: kéo để xem, chạm để chọn và ra lệnh"></div>
  <div id="d3ChuNoi"></div>

  <div class="d3Tren">
    <a class="d3Nut d3Khung" href="dautruongtrithuc.html" aria-label="Về sảnh Đấu Trường">⬅</a>
    <div class="d3Ten d3Khung" id="d3TenVuong">Thung Lũng Khởi Đầu</div>
    <div class="d3Kho d3Khung" aria-label="Tài nguyên">
      <span class="d3Tn" title="Gỗ">🪵 <b id="d3Go">0</b></span>
      <span class="d3Tn" title="Đá">🪨 <b id="d3Da">0</b></span>
      <span class="d3Tn" title="Vàng">🪙 <b id="d3Vang">0</b></span>
      <span class="d3Tn" title="Lương thực">🍖 <b id="d3Lt">0</b></span>
    </div>
  </div>

  <div class="d3Duoi">
    <div class="d3Khung" id="d3GoiY" role="status" aria-live="polite">Đang dựng thung lũng…</div>
    <div class="d3HangNut">
      <span class="d3Khung d3Do" id="d3Chon">Chưa chọn ai</span>
      <span class="d3Khung d3Do d3Pt" id="d3KhamPha" hidden>🗺️ Đã khám phá 0%</span>
      <span class="d3Khung d3Do" id="d3Fps">… khung/giây</span>
    </div>
    <div class="d3HangNut">
      <button class="d3Nut d3Khung" id="d3VeLang" type="button" aria-label="Về lều">🏕️<span class="d3Chu"> Về lều</span></button>
      <button class="d3Nut d3Khung" id="d3SoiDat" type="button" aria-label="Chọn chỗ dựng Lều trại" aria-pressed="false" hidden>🏕️<span class="d3Chu"> Dựng lều</span></button>
      <button class="d3Nut d3Khung" id="d3KhamPhaNut" type="button" aria-label="Nông dân đi khám phá" hidden>🔭<span class="d3Chu"> Đi khám phá</span></button>
      <button class="d3Nut d3Khung" id="d3DoHoa" type="button">✨ Đồ họa: Đẹp</button>
      <button class="d3Nut d3Khung" id="d3DoiHinh" type="button" aria-label="Thử ngoại hình">🎨<span class="d3Chu"> Ngoại hình</span></button>
      <button class="d3Nut d3Khung" id="d3ThuTran" type="button" aria-label="Thử động tác trận">⚔️<span class="d3Chu"> Động tác trận</span></button>
      <button class="d3Nut d3Khung" id="d3Tua" type="button" aria-label="Tua nhanh 3 giờ">⏩<span class="d3Chu"> Tua 3 giờ</span></button>
      <button class="d3Nut d3Khung" id="d3ThemNd" type="button" aria-label="Thêm nông dân">➕🧑‍🌾 <span id="d3SoNd">0</span></button>
      <button class="d3Nut d3Khung" id="d3LamLai" type="button" aria-label="Vào lại thung lũng từ đầu" hidden>🔄<span class="d3Chu"> Vào lại</span></button>
    </div>
  </div>

  <div id="d3Tai"><div id="d3TaiChu">Đang dựng thung lũng…</div></div>

  <script src="chung/nv_ve.js"></script>
  <script src="dt/dt_luoi.js"></script>
  <script src="dt/dt_lang.js"></script>
  <script src="dt/dt_ban_do.js"></script>
  <script src="dt/dt_may_chu.js"></script>
  <script type="module" src="dt/3d/dt3d_thu.js"></script>
</body>
</html>
