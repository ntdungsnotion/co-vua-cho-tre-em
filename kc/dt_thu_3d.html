<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#14204a">
  <title>Làng 3D (thử) - Đấu Trường Tri Thức</title>

  <!-- ================================================================
       FILE: dt_thu_3d.html
       CHỨC NĂNG: Trang MẪU THỬ làng 3D kiểu Đế Chế của Đấu Trường Tri Thức (chưa nối vào
                  trang game chính, chưa có nút dẫn tới; mở bằng địa chỉ). Toàn màn hình:
                  cảnh 3D + thanh tài nguyên + gợi ý + nút đồ họa Đẹp / Nhẹ + số khung hình.
                  Không cần đăng nhập: ngoại hình Thủ lĩnh đọc hồ sơ chung có sẵn trên máy.
                  Thử nhiều nông dân: thêm ?nd=20 vào địa chỉ. Nút "Tua 3 giờ" để xem cây / mỏ /
                  cá / bụi mọc lại (chỉ có ở trang thử).
       BƯỚC: TC_D01C; TC_D02A (lõi dt_lang.js + phần vẽ tách từng phần dt/3d/, 4 loại tài nguyên)
       NGÀY: 23/10/2026
       PHỤ THUỘC: thu_vien/three (Three.js r170, MIT), chung/nv_ve.js, dt/dt_luoi.js, dt/dt_lang.js,
                  dt/3d/*.js (khởi động: dt/3d/dt3d_thu.js), dt/mo_hinh/*.glb (KayKit, CC0),
                  dt/du_lieu/lang_thu_3d.json, dt/du_lieu/cau_hinh.json
       ================================================================ -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --dem: #14204a; --dem2: #1f2f6b; --vang: #ffc24b; --cam: #ff8a3d; --sang: #fff6dc; --nhat: #b9c3ec; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--dem); color: var(--sang);
      font-family: "Be Vietnam Pro", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    #d3Canh { position: fixed; inset: 0; }
    #d3Canh canvas { display: block; width: 100%; height: 100%; }
    .d3Khung { background: rgba(20, 32, 74, .82); border: 2px solid rgba(255, 194, 75, .6); border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .25); backdrop-filter: blur(3px); }
    /* Thanh trên: về sảnh, tên vương quốc, tài nguyên */
    .d3Tren { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 8px; right: 8px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
    .d3Tren > * { pointer-events: auto; }
    .d3Nut { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 1rem; color: var(--sang); min-height: 44px; min-width: 44px;
      padding: 6px 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
    .d3Nut:active { transform: translateY(1px); }
    .d3Nut:focus-visible { outline: 3px solid var(--vang); outline-offset: 2px; }
    .d3Ten { font-family: "Baloo 2", sans-serif; font-weight: 800; color: var(--vang); padding: 6px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
    .d3Kho { display: flex; gap: 6px; padding: 4px 8px; flex: 0 0 auto; }
    .d3Tn { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 1.1rem; min-width: 64px; padding: 4px 6px; text-align: center; white-space: nowrap; }
    /* Thanh dưới: gợi ý, nhân vật đang chọn, nút thử */
    .d3Duoi { position: fixed; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); display: grid; gap: 8px; pointer-events: none; }
    .d3Duoi > * { pointer-events: auto; }
    #d3GoiY { padding: 10px 14px; font-size: 1.05rem; line-height: 1.4; font-weight: 600; }
    #d3Chon { color: var(--vang); font-family: "Baloo 2", sans-serif; font-weight: 800; }
    .d3HangNut { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .d3Do { font-size: .85rem; color: var(--nhat); padding: 4px 10px; }
    /* Chữ nổi "+5 🪵" và dấu "!" nông dân rảnh */
    #d3ChuNoi { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .d3Noi { position: absolute; left: 0; top: 0; font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 1.5rem; color: #fff6c8;
      text-shadow: 0 2px 0 #6b3a00, 0 0 8px rgba(0, 0, 0, .45); white-space: nowrap; }
    .d3Ranh { position: absolute; left: 0; top: 0; pointer-events: none; font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 1.6rem;
      color: #fff; background: var(--cam); border: 2px solid #fff; border-radius: 50%; width: 30px; height: 30px; line-height: 28px; text-align: center;
      animation: nay 0.8s ease-in-out infinite alternate; }
    @keyframes nay { to { margin-top: -6px; } }
    /* Màn chờ tải */
    #d3Tai { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(120% 90% at 50% 0%, #2b3f8a, var(--dem) 70%); z-index: 5; }
    #d3TaiChu { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--vang); padding: 20px; text-align: center; }
    [hidden] { display: none !important; }
    @media (min-width: 900px) {
      .d3Duoi { left: auto; right: 12px; bottom: 12px; width: 420px; }
      .d3Tren { left: 12px; right: 12px; top: 12px; }
      .d3Ten { flex: 0 1 auto; }
    }
    @media (max-width: 600px) {
      .d3Ten { display: none; } /* điện thoại: nhường chỗ cho 4 ô tài nguyên */
      .d3Kho { flex: 1 1 auto; justify-content: space-around; gap: 2px; padding: 4px; min-width: 0; }
      .d3Tn { min-width: 0; font-size: .95rem; padding: 4px 2px; }
      #d3GoiY { font-size: .95rem; padding: 8px 12px; }
      .d3Nut { font-size: .92rem; padding: 6px 8px; }
      .d3Chu { display: none; }
      .d3Duoi { gap: 6px; }
      .d3HangNut { gap: 6px; }
    }
    @media (prefers-reduced-motion: reduce) { .d3Ranh { animation: none; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "./thu_vien/three/three.module.min.js" } }
  </script>
</head>
<body>
  <div id="d3Canh" aria-label="Thung lũng 3D: kéo để xem, chạm để chọn và ra lệnh"></div>
  <div id="d3ChuNoi"></div>

  <div class="d3Tren">
    <a class="d3Nut d3Khung" href="dautruongtrithuc.html" aria-label="Về sảnh Đấu Trường">⬅</a>
    <div class="d3Ten d3Khung" id="d3TenVuong">Thung Lũng Khởi Đầu</div>
    <div class="d3Kho d3Khung" aria-label="Tài nguyên">
      <span class="d3Tn" title="Gỗ">🪵 <b id="d3Go">0</b></span>
      <span class="d3Tn" title="Đá">🪨 <b id="d3Da">0</b></span>
      <span class="d3Tn" title="Vàng">🪙 <b id="d3Vang">0</b></span>
      <span class="d3Tn" title="Lương thực">🍖 <b id="d3Lt">0</b></span>
    </div>
  </div>

  <div class="d3Duoi">
    <div class="d3Khung" id="d3GoiY" role="status" aria-live="polite">Đang dựng thung lũng…</div>
    <div class="d3HangNut">
      <span class="d3Khung d3Do" id="d3Chon">Chưa chọn ai</span>
      <span class="d3Khung d3Do" id="d3Fps">… khung/giây</span>
    </div>
    <div class="d3HangNut">
      <button class="d3Nut d3Khung" id="d3VeLang" type="button" aria-label="Về lều">🏕️<span class="d3Chu"> Về lều</span></button>
      <button class="d3Nut d3Khung" id="d3DoHoa" type="button">✨ Đồ họa: Đẹp</button>
      <button class="d3Nut d3Khung" id="d3DoiHinh" type="button" aria-label="Thử ngoại hình">🎨<span class="d3Chu"> Ngoại hình</span></button>
      <button class="d3Nut d3Khung" id="d3ThuTran" type="button" aria-label="Thử động tác trận">⚔️<span class="d3Chu"> Động tác trận</span></button>
      <button class="d3Nut d3Khung" id="d3Tua" type="button" aria-label="Tua nhanh 3 giờ">⏩<span class="d3Chu"> Tua 3 giờ</span></button>
      <button class="d3Nut d3Khung" id="d3ThemNd" type="button" aria-label="Thêm nông dân">➕🧑‍🌾 <span id="d3SoNd">0</span></button>
    </div>
  </div>

  <div id="d3Tai"><div id="d3TaiChu">Đang dựng thung lũng…</div></div>

  <script src="chung/nv_ve.js"></script>
  <script src="dt/dt_luoi.js"></script>
  <script src="dt/dt_lang.js"></script>
  <script type="module" src="dt/3d/dt3d_thu.js"></script>
</body>
</html>
