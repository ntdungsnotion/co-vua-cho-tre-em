<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#14204a">
  <title>Đấu thử - Đấu Trường Tri Thức</title>
  <!-- ================================================================
       FILE: dt/thu_tran_dau.html
       CHỨC NĂNG: Trang ĐẤU THỬ của Đấu Trường Tri Thức (không có nút dẫn tới, mở bằng địa chỉ).
                  Thủ lĩnh đấu theo lượt với một quái (Slime Số / Nấm Chữ Cái / Đom Đóm), luật ở
                  dt_tran_dau.js; câu Toán / Tiếng Anh theo trình độ của bé (dt_cau_hoi.js, lưu ở máy này).
                  Điện thoại: sân đấu nửa trên, câu hỏi nửa dưới. Máy tính: sân rộng bên trái, câu hỏi
                  bên phải. TC_D06 đưa màn này vào bản đồ (chạm quái mở trận).
       BƯỚC: TC_D05; TC_D05 sửa 29/10/2026 chiều (người dùng: bỏ chữ hướng dẫn, tự sang lượt,
             quái nghĩ nhanh, sân 3D 3d/dt3d_tran.js thay hình 2D; hình 2D chỉ còn khi máy không có WebGL);
             TC_D05B1 (chọn Tướng Nam / Nữ: tướng người thật 3d/dt3d_tuong.js);
             TC_D05B2 (hàng nút thử 5 chiêu lớn phủ vùng trên sân 3D);
             TC_D05B3 (âm thanh chiến đấu: nút 🔊 / 🔇 ở thanh trên, tiếng do 3d/dt3d_am_thanh.js;
             nhạc nền từ thư viện am_thanh/thu_vien.json do quản trị đặt, bé KHÔNG tắt / đổi được (người dùng
             30/10/2026); nhạc nhỏ lại khi máy đọc câu);
             TC_D06A (?nhung=1&quai=&lv=&cl=&gioi=&lop=&ten=&tl=&chu=: MÀN CHIẾN ĐẤU THẬT mở từ bản đồ Thung Lũng
             (khung phủ của 3d/dt3d_quai_ban_do.js): vào trận ngay, không hộp chọn / nút thử chiêu, trình độ lưu
             riêng từng bé "kc_dt_trinh_do_<tên>", xong trận postMessage "dt-tran-ket" cho bản đồ, nút "⬅ Về thung
             lũng" / "🏃 Rút lui" postMessage "dt-tran-dong");
             TC_D06C2a (&quaiTruoc=1: quái hung dữ lao vào Thủ lĩnh, quái tấn công lượt đầu)
             TC_D06C2b (&vai=nong_dan&hp=&hpQuai=&luot=&nd=: bé VÀO ĐIỀU KHIỂN nông dân đang đánh quái trên bản đồ: chỉ số
             nông dân theo tộc, đánh tiếp từ máu hai bên + số lượt đã đánh; thua = nông dân bỏ chạy (không nghỉ Lều);
             "dt-tran-ket" / "dt-tran-dong" gửi kèm hpBe = máu nông dân còn)
             TC_D06C2g (&hp=: Thủ lĩnh vào trận quái với máu còn lại; &tru=1&tran=&loaiTru=&tenTru=&cap=&mauBe=&mauBeToiDa=&mauTru=
             &mauTruToiDa=&giayBe=&nghi=: TRẬN TRỤ: trụ của bé khác khai chiến, máy chủ giữ câu + chấm, gọi qua bản đồ bằng postMessage
             "dt-tru-hoi" / "dt-tru-dap"; lượt trụ: câu theo trình độ của bé; lượt bé: câu của trụ, sai / hết giờ bị phản đòn)
             KC_06B2 (11/11/2026: trận thật hỏi câu KHO CÂU CHUNG, máy bé không có đáp án, MÁY CHỦ CHẤM (Hướng Dẫn 3.17);
             nhờ bản đồ gọi máy chủ qua postMessage "dt-kho-hoi" / "dt-kho-dap" (ô câu, lô câu, chấm, số Quản trị); PHA TỤ LỰC che
             lúc chờ chấm (đồng hồ dừng lúc bé chạm, chờ mạng lâu thì "Đang chờ mạng..."); trang thật KHÔNG nạp bộ sinh câu nữa.
             Trang thử (không ?nhung) vẫn dùng bộ sinh; &kho=gia: thử đường kho bằng kho giả dựng từ bộ sinh, &tre=<ms> giả mạng chậm; &nhanh=0: kho giả không kèm mã chấm nhanh)
       NGÀY: 29/10/2026; 29/10/2026 22:47; 30/10/2026; 30/10/2026 06:00; 30/10/2026 (TC_D06A); 04/11/2026 (TC_D06C2a)
       PHỤ THUỘC: chung/nv_ve.js, dt/dt_trinh_do.js, dt/dt_nguon_kho.js (KC_06B2), dt/dt_sinh_toan.js + dt/dt_sinh_tieng_anh.js (chỉ trang thử),
                  dt/dt_cau_hoi.js, dt/dt_quai.js, dt/dt_tran_dau.js, dt/dt_ve_quai.js,
                  dt/du_lieu/cau_hinh_tran_dau.json, dt/du_lieu/cau_hinh_trinh_do.json, tu_vung/kho_tu.json
       ================================================================ -->
  <style>
    :root {
      --dem: #14204a; --dem2: #1c2b63; --the: #22347a; --vang: #ffc24b; --sang: #fff6dc; --nhat: #b9c3ec;
      --xanh: #3ddc84; --do: #ff6b6b; --tim: #9b7bff; --vien: rgba(255, 194, 75, .55);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--dem); color: var(--sang); font-family: system-ui, "Segoe UI", sans-serif; }
    body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; font-size: 18px; }
    button, select { font: inherit; color: inherit; }
    .an { display: none !important; }

    .dau { display: flex; align-items: center; gap: 10px; padding: 8px 14px; }
    .dau h1 { font-size: 1.05rem; margin: 0 auto 0 0; color: var(--vang); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nut { background: var(--the); border: 2px solid var(--vang); border-radius: 12px; padding: 8px 16px; min-height: 48px; cursor: pointer; font-weight: 600; }
    .nut.chinh { background: var(--vang); color: var(--dem); }
    .dau .nut { white-space: nowrap; }
    .dau .nut.tieng { padding: 4px 12px; font-size: 1.3rem; line-height: 1; }
    .tren-may { display: none; }
    .nut:disabled { opacity: .45; cursor: default; }

    .tran { flex: 1; display: flex; flex-direction: column; min-height: 0; }

    /* ---- sân đấu ---- */
    .san { position: relative; height: 46vh; height: 46dvh; min-height: 240px; overflow: hidden; border-bottom: 2px solid var(--vien); }
    .san canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .san3d { position: absolute; inset: 0; }
    .san3d canvas { display: block; }
    .dang-tai { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--nhat); background: #1c2b63; }
    .the-ben { position: absolute; top: 8px; width: calc(50% - 14px); background: rgba(20, 32, 74, .82); border: 1px solid var(--vien); border-radius: 12px; padding: 6px 10px; font-size: .85rem; }
    .the-ben.trai { left: 8px; } .the-ben.phai { right: 8px; text-align: right; }
    .the-ben .ten { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .the-ben .ten small { color: var(--nhat); font-weight: 500; }
    .vach { position: relative; height: 12px; background: #0d1638; border-radius: 6px; overflow: hidden; margin-top: 4px; }
    .vach i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 6px; transition: width .45s ease; }
    .the-ben.phai .vach i { left: auto; right: 0; }
    .vach.hp i { background: linear-gradient(90deg, #3ddc84, #b5f05a); }
    .vach.hp.thap i { background: linear-gradient(90deg, #ff6b6b, #ffb35a); }
    .vach.mp { height: 7px; } .vach.mp i { background: var(--tim); }
    .so-hp { font-size: .8rem; color: var(--nhat); margin-top: 2px; }
    /* nút thử chiêu lớn phủ vùng (TC_D05B2) */
    .chieu-thu { display: flex; gap: 6px; padding: 0 14px 8px; overflow-x: auto; scrollbar-width: none; }
    .chieu-thu button { flex: 0 0 auto; min-height: 48px; padding: 4px 12px; border-radius: 12px; border: 2px solid var(--vien); background: rgba(20, 32, 74, .82); font-size: .85rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .chieu-thu button:disabled { opacity: .45; cursor: default; }
    .combo { color: var(--vang); font-weight: 700; }
    .bang-luot { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: rgba(20, 32, 74, .88); border: 2px solid var(--vang); border-radius: 999px; padding: 5px 16px; font-weight: 700; white-space: nowrap; font-size: .95rem; }
    .bang-luot.quai { border-color: var(--do); }
    .so-bay { position: absolute; transform: translate(-50%, 0); font-weight: 900; font-size: 1.9rem; color: #fff; text-shadow: 0 2px 0 #1d1630, 0 0 10px rgba(0,0,0,.6); pointer-events: none; animation: bay 1.1s ease-out forwards; white-space: nowrap; }
    .so-bay.ne { color: #9fe8ff; } .so-bay.chi-mang { color: var(--vang); font-size: 2.3rem; } .so-bay.mp { color: #c9b6ff; font-size: 1.3rem; }
    @keyframes bay { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.7); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -60px) scale(1); } }

    /* ---- câu hỏi ---- */
    .cau { flex: 1; padding: 12px 16px 18px; overflow: auto; position: relative; }
    .dong-ho { display: flex; align-items: center; gap: 10px; min-height: 24px; margin-bottom: 8px; color: var(--nhat); }
    .dong-ho.tat { visibility: hidden; }
    .dong-ho .vach { flex: 1; height: 10px; margin: 0; }
    .dong-ho .vach i { background: var(--vang); transition: none; }
    .dong-ho.gap .vach i { background: var(--do); }
    .dong-ho b { color: var(--sang); min-width: 3.2em; text-align: right; }
    .nhan { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .nhan span { background: var(--the); border-radius: 999px; padding: 3px 10px; font-size: .8rem; color: var(--nhat); }
    .hinh-chu { font-size: 2rem; line-height: 1.25; text-align: center; letter-spacing: 2px; word-break: break-all; margin: 4px 0 6px; }
    .hinh-chu img { width: 96px; height: 96px; object-fit: contain; }
    .noi-dung { font-size: 1.35rem; font-weight: 700; text-align: center; margin: 6px 0 12px; line-height: 1.35; }
    .nghe { display: flex; justify-content: center; margin: -4px 0 10px; }
    .dap-an { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .dap-an button { position: relative; min-height: 60px; font-size: 1.25rem; font-weight: 700; border-radius: 14px; border: 3px solid var(--nhat); background: var(--the); cursor: pointer; padding: 8px; }
    .dap-an button:hover:not(:disabled) { border-color: var(--vang); }
    .dap-an button:disabled { cursor: default; }
    .dap-an button.da-chon { border-color: var(--vang); box-shadow: 0 0 0 3px rgba(255, 194, 75, .35); }
    .dap-an button.dung { background: #1f6b45; border-color: var(--xanh); }
    .dap-an button.sai { background: #7a2a36; border-color: var(--do); }
    .dap-an button .the-chon { position: absolute; top: -10px; font-size: .7rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
    .dap-an button .the-chon.be { left: 8px; background: var(--vang); color: var(--dem); }
    .dap-an button .the-chon.quai { right: 8px; background: var(--do); color: #fff; }
    .ket-qua { margin-top: 12px; min-height: 1.4em; }
    .ket-qua .kieu { font-size: 1.2rem; font-weight: 800; }
    .ket-qua .cho-mang { font-size: .85rem; color: var(--nhat); } /* KC_06B2: chờ máy chủ chấm quá lâu */
    .loi-giai { margin-top: 4px; color: var(--nhat); line-height: 1.45; font-size: 1rem; }
    .tiep { margin-top: 10px; display: flex; justify-content: flex-end; }

    /* ---- hộp chọn trận + kết thúc ---- */
    .man-phu { position: fixed; inset: 0; background: rgba(8, 12, 32, .78); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
    .hop { background: var(--dem2); border: 2px solid var(--vien); border-radius: 18px; padding: 18px; width: 100%; max-width: 560px; max-height: 100%; overflow: auto; }
    .hop h2 { margin: 0 0 12px; color: var(--vang); font-size: 1.25rem; }
    .hop h3 { margin: 14px 0 6px; font-size: .95rem; color: var(--nhat); font-weight: 600; }
    .chon-quai { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .chon-quai button, .chon-cl button { background: var(--the); border: 2px solid transparent; border-radius: 14px; padding: 6px 4px 8px; cursor: pointer; font-size: .9rem; min-height: 48px; }
    .chon-quai button[aria-pressed="true"], .chon-cl button[aria-pressed="true"] { border-color: var(--vang); background: #2c3f8f; }
    .chon-quai canvas { width: 100%; height: 86px; display: block; }
    .chon-quai small { display: block; color: var(--nhat); font-size: .75rem; }
    .chon-cl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .hang { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
    .hang label { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; }
    select { background: var(--the); border: 1px solid var(--vang); border-radius: 10px; padding: 8px; min-height: 44px; }
    input[type="checkbox"] { width: 24px; height: 24px; }
    .ghi { color: var(--nhat); font-size: .85rem; margin: 2px 0 0; }
    .hop .nut-day { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
    .tong-ket { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin: 10px 0; }
    .tong-ket div { background: var(--the); border-radius: 10px; padding: 6px 10px; font-size: .85rem; color: var(--nhat); }
    .tong-ket b { display: block; color: var(--sang); font-size: 1.15rem; }
    .nghi { font-size: 2.4rem; font-weight: 800; color: var(--vang); text-align: center; margin: 8px 0; }

    /* ---- máy tính: 2 cột, sân rộng bên trái ---- */
    @media (min-width: 900px) {
      body { font-size: 19px; height: 100vh; }
      .dau { padding: 10px 24px; } .dau h1 { font-size: 1.35rem; }
      .tren-may { display: inline; }
      .tran { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(380px, 1fr); min-height: 0; }
      .san { height: auto; min-height: 0; border-bottom: 0; border-right: 2px solid var(--vien); }
      .the-ben { top: 14px; width: min(320px, calc(50% - 24px)); font-size: .95rem; padding: 8px 14px; }
      .the-ben.trai { left: 14px; } .the-ben.phai { right: 14px; }
      .vach { height: 16px; } .vach.mp { height: 9px; }
      .bang-luot { font-size: 1.15rem; bottom: 18px; padding: 8px 22px; }
      .cau { padding: 22px 28px; display: flex; flex-direction: column; }
      .noi-dung { font-size: 1.9rem; margin: 10px 0 18px; }
      .hinh-chu { font-size: 2.6rem; } .hinh-chu img { width: 130px; height: 130px; }
      .dap-an { gap: 14px; }
      .dap-an button { min-height: 84px; font-size: 1.6rem; }
      .so-bay { font-size: 2.6rem; } .so-bay.chi-mang { font-size: 3.2rem; }
    }
    /* màn rộng (1600 px trở lên): chữ, thẻ, nút to hơn */
    @media (min-width: 1600px) and (min-height: 800px) {
      body { font-size: 22px; }
      .the-ben { width: min(440px, calc(50% - 24px)); font-size: 1.05rem; }
      .vach { height: 20px; } .vach.mp { height: 11px; }
      .so-hp { font-size: .95rem; }
      .cau { padding: 34px 40px; }
      .nhan span { font-size: .9rem; }
      .noi-dung { font-size: 2.4rem; }
      .dap-an button { min-height: 110px; font-size: 2rem; }
      .loi-giai { font-size: 1.1rem; }
    }
    /* laptop thấp (14" phóng 125 % ~ 1229 x 600): gọn chiều cao để thấy đủ 4 đáp án */
    @media (min-width: 900px) and (max-height: 700px) {
      .dau { padding: 6px 20px; } .dau .nut { min-height: 40px; padding: 4px 12px; }
      .cau { padding: 12px 22px; }
      .noi-dung { font-size: 1.5rem; margin: 4px 0 10px; }
      .hinh-chu { font-size: 2rem; margin: 0 0 4px; } .hinh-chu img { width: 84px; height: 84px; }
      .dap-an button { min-height: 58px; font-size: 1.35rem; }
      .dong-ho { margin-bottom: 4px; }
    }
  </style>
</head>
<body>
  <div class="dau">
    <h1>⚔️ Đấu thử<span class="tren-may"> · Đấu Trường Tri Thức</span></h1>
    <button class="nut tieng an" id="nutTieng" title="Tắt tiếng" aria-label="Tắt tiếng">🔊</button>
    <button class="nut" id="nutChonTran">Chọn trận</button>
    <button class="nut an" id="nutRutLui" aria-label="Rút lui về thung lũng">🏃<span class="tren-may"> Rút lui</span></button>
  </div>
  <div class="chieu-thu an" id="chieuThu">
    <button data-ma="mua_lua">🔥 Mưa lửa</button>
    <button data-ma="thien_thach">☄️ Thiên thạch</button>
    <button data-ma="loc_xoay">🌪️ Lốc xoáy</button>
    <button data-ma="dam_dat">🦶 Dậm đất</button>
    <button data-ma="vo_khong_gian">👊 Vỡ không gian</button>
    <button data-ma="mua_ten">🏹 Mưa tên</button>
    <button data-ma="chuong">💥 Chưởng sáng</button>
  </div>

  <div class="tran">
    <section class="san" id="san">
      <canvas id="canvas"></canvas>
      <div class="san3d" id="san3d"></div>
      <div class="dang-tai" id="dangTai">Đang tải sân đấu…</div>
      <div class="the-ben trai">
        <div class="ten" id="tenBe">Thủ lĩnh</div>
        <div class="vach hp" id="hpBeV"><i id="hpBe"></i></div>
        <div class="vach mp"><i id="mpBe"></i></div>
        <div class="so-hp"><span id="soHpBe"></span> <span class="combo" id="comboBe"></span></div>
      </div>
      <div class="the-ben phai">
        <div class="ten" id="tenQuai">Quái</div>
        <div class="vach hp" id="hpQuaiV"><i id="hpQuai"></i></div>
        <div class="vach mp"><i id="mpQuai"></i></div>
        <div class="so-hp"><span class="combo" id="comboQuai"></span> <span id="soHpQuai"></span></div>
      </div>
      <div class="bang-luot an" id="bangLuot"></div>
    </section>

    <section class="cau" aria-live="polite">
      <div class="dong-ho" id="dongHo"><span class="vach" id="dhVach"><i id="dhI"></i></span><b id="dhSo"></b></div>
      <div class="hinh-chu an" id="cHinh"></div>
      <div class="noi-dung" id="cNoiDung">Đang nạp...</div>
      <div class="nghe"><button class="nut an" id="nutNghe">🔊 Nghe lại</button></div>
      <div class="dap-an" id="cDapAn"></div>
      <div class="ket-qua" id="cKetQua"></div>
    </section>
  </div>

  <!-- chọn trận -->
  <div class="man-phu an" id="manChon">
    <div class="hop" role="dialog" aria-labelledby="tdChon">
      <h2 id="tdChon">Chọn trận</h2>
      <h3>Quái</h3>
      <div class="chon-quai" id="chonQuai"></div>
      <div class="hang" style="margin-top: 8px">
        <label>Cấp quái <select id="chonLv"></select></label>
        <label>Lớp đang học <select id="chonLop"></select></label>
        <label>Tướng <select id="chonGioi"><option value="nam">Nam</option><option value="nu">Nữ</option></select></label>
      </div>
      <h3>Chủng loại Thủ lĩnh</h3>
      <div class="chon-cl" id="chonCl"></div>
      <div class="hang" style="margin-top: 6px">
        <label><input type="checkbox" id="chonThongTha"> Chế độ Thong thả</label>
      </div>
      <div class="nut-day"><button class="nut an" id="nutDongChon">Đóng</button><button class="nut chinh" id="nutVaoTran">Vào trận</button></div>
    </div>
  </div>

  <!-- kết thúc -->
  <div class="man-phu an" id="manKet">
    <div class="hop" role="dialog" aria-labelledby="tdKet">
      <h2 id="tdKet"></h2>
      <div class="nghi an" id="ketNghi"></div>
      <div class="tong-ket" id="ketTong"></div>
      <div class="nut-day">
        <button class="nut an" id="nutBoNghi">Bỏ qua thời gian nghỉ (trang thử)</button>
        <button class="nut" id="nutDoiTran">Chọn trận khác</button>
        <button class="nut chinh" id="nutDauLai">Đấu lại</button>
        <button class="nut chinh an" id="nutVeBanDo">⬅ Về thung lũng</button>
      </div>
    </div>
  </div>

  <script src="../chung/nv_ve.js"></script>
  <script src="dt_trinh_do.js"></script>
  <script src="dt_nguon_kho.js"></script> <!-- KC_06B2: câu kho chung, máy chủ chấm; bộ sinh câu chỉ nạp ở trang thử (khoiDong) -->
  <script src="dt_cau_hoi.js"></script>
  <script src="dt_quai.js"></script>
  <script src="dt_tran_dau.js"></script>
  <script src="dt_ve_quai.js"></script>
  <script type="importmap">{ "imports": { "three": "../thu_vien/three/three.module.min.js" } }</script>
  <script type="module" src="3d/dt3d_tran.js"></script>
  <script>
  (function () {
    "use strict";
    const NV = window.KC_NV, TD = window.KC_DT_TRINH_DO, NK = window.KC_DT_NGUON_KHO;
    let ST = null, TA = null; // bộ sinh câu: chỉ trang thử (không ?nhung) mới nạp
    const CH = window.KC_DT_CAU_HOI, QU = window.KC_DT_QUAI, TR = window.KC_DT_TRAN_DAU, VQ = window.KC_DT_VE_QUAI;
    // TC_D06A: ?nhung=1 = màn chiến đấu thật mở từ bản đồ (khung phủ của dt3d_quai_ban_do.js): quái + cấp + Thủ lĩnh
    // theo tham số, không có hộp chọn trận / nút thử chiêu; xong trận báo bản đồ (postMessage) rồi về thung lũng
    const TS = new URLSearchParams(location.search), NHUNG = TS.get("nhung") === "1";
    const TEN_BE = String(TS.get("ten") || "").trim().toLowerCase();
    const KHOA = NHUNG ? "kc_dt_trinh_do_" + (TEN_BE || "khach") : "kc_dt_thu_tran_dau"; // trình độ câu hỏi: riêng từng bé
    const baoBanDo = du => { try { if (window.parent !== window) window.parent.postMessage(du, location.origin); } catch (e) { /* không có bản đồ */ } };
    const $ = id => document.getElementById(id);
    const bayGio = () => performance.now();
    const TEN_MUC = { de: "Dễ", vua: "Vừa", kho: "Khó" };
    const TEN_MON = { toan: "Toán", tieng_anh: "Tiếng Anh" };
    const TEN_CL = { nhan: "🛡️ Nhân tộc", quy: "🔥 Quỷ tộc", tien: "🌿 Tiên tộc" };
    const CHU_QUAI = { slime_so: () => String(1 + Math.floor(Math.random() * 9)), nam_chu_cai: () => "ABCDEFGHKLMNPRST"[Math.floor(Math.random() * 16)], dom_dom: () => "?" };

    let chTran = null, chTD = null, bo = null, NG = {};
    let chon = { quai: "slime_so", lv: 1, lop: 2, cl: "nhan", gioi: "nam", thongTha: null };
    let hs = null, T = null, cauNay = null, chuQuai = "7";
    let hieuUng = null; // { loai: "danh"|"trung"|"ne", ben, t0 }
    let ketThucLuc = 0, beThu = false, quaiThu = false, henTiep = 0;
    let san3d = null; // sân 3D (3d/dt3d_tran.js); null = vẽ 2D trên canvas

    // hồ sơ Thủ lĩnh cho sân 3D; ?tuong=<mã trong du_lieu/tuong.json> để xem thử một tướng bất kỳ (TC_D05B1)
    const TUONG_THU = new URLSearchParams(location.search).get("tuong");
    const LA_DAN = NHUNG && TS.get("vai") === "nong_dan"; // TC_D06C2b: bé điều khiển nông dân
    // TC_D06C2g: TRẬN TRỤ (?tru=1&tran=<id>): trụ của bé khác khai chiến Thủ lĩnh. MÁY CHỦ giữ câu + đáp án của trụ, chấm lượt bé,
    // quyết trụ đúng / sai ở lượt trụ (luật dt/dt_tru_tran.js). Trang này không tự gọi máy chủ: nhờ bản đồ (dt3d_tru.js) gọi hộ
    // qua postMessage { loai: "dt-tru-hoi", so, ham: "luot" | "tra", ts } -> { loai: "dt-tru-dap", so, kq }.
    const TRU = NHUNG && TS.get("tru") === "1", ID_TRAN = Number(TS.get("tran"));
    let soHoi = 0;
    const choDap = new Map();
    window.addEventListener("message", e => {
      if (e.source !== window.parent || !e.data || e.data.loai !== "dt-tru-dap") return;
      const f = choDap.get(e.data.so); if (f) { choDap.delete(e.data.so); f(e.data.kq || { ok: false }); }
    });
    const hoiBanDo = (ham, ts) => new Promise(res => {
      const so = ++soHoi; choDap.set(so, res);
      baoBanDo({ loai: "dt-tru-hoi", so, ham, ts: Object.assign({ tran: ID_TRAN }, ts) });
      setTimeout(() => { if (choDap.delete(so)) res({ ok: false, ma: "mang", lyDo: "Không kết nối được máy chủ." }); }, 12000);
    });
    function hoSoBe() {
      if (LA_DAN && NV.hoSoNongDan) return Object.assign(NV.hoSoNongDan(chon.cl, +TS.get("nd") || 0), { nongDan: true });
      const h = { chungLoai: chon.cl, gioi: chon.gioi || "nam" }; if (TUONG_THU) h.tuong = TUONG_THU; return h;
    }

    // ---------- KC_06B2: KHO CÂU CHUNG, MÁY CHỦ CHẤM ----------
    // Trận thật (?nhung): nhờ bản đồ (dt3d_thu.js) gọi máy chủ: { loai: "dt-kho-hoi", so, ham: "o" | "lo" | "cham" | "cauHinh", ts }
    // -> { loai: "dt-kho-dap", so, kq }. Trang thử &kho=gia: kho giả dựng từ bộ sinh (dt_nguon_kho.js khoGia).
    const KHO = NHUNG || TS.get("kho") === "gia";
    let kho = null, tuLucCh = { toiThieuGiay: 0.5, manhSauGiay: 1.5, choMangGiay: 6 }, soMo = 0, latBai = 0;
    const choKho = new Map(); let soKho = 0;
    window.addEventListener("message", e => {
      if (e.source !== window.parent || !e.data || e.data.loai !== "dt-kho-dap") return;
      const f = choKho.get(e.data.so); if (f) { choKho.delete(e.data.so); f(e.data.kq || { ok: false, ma: "mang" }); }
    });
    const hoiKho = (ham, ts) => new Promise(res => {
      if (window.parent === window) return res({ ok: false, ma: "mang" });
      const so = ++soKho; choKho.set(so, res);
      baoBanDo({ loai: "dt-kho-hoi", so, ham, ts: ts || {} });
      setTimeout(() => { if (choKho.delete(so)) res({ ok: false, ma: "mang" }); }, 8000);
    });
    const ngu = ms => new Promise(x => setTimeout(x, ms));
    // câu cho lượt mới: kho (chọn độ khó vừa sức như cũ, lô trống thì chờ) hoặc bộ sinh (trang thử)
    async function layCau(mon) { return KHO ? kho.cauTiep(bo, hs, mon) : bo.cauTiep(hs, mon); }
    // Máy chủ chấm (chon null = lật bài khi bé không kịp bấm). Kéo tối thiểu tuLuc.toiThieuGiay; chờ lâu -> tụ mạnh / "Đang chờ mạng..."
    async function chamKho(cau, chon, tMo, tl) {
      const t0 = bayGio(), Tcu = T, ch = tuLucCh;
      const henManh = tl ? setTimeout(() => tl.manh(), ch.manhSauGiay * 1000) : 0;
      let daBaoCho = false;
      const henCho = setTimeout(() => { daBaoCho = true; if (tl) tl.choMang(true); hienChoMang(true); }, ch.choMangGiay * 1000);
      const kq = await kho.cham(cau, chon, Math.max(0, (t0 - tMo) / 1000), { dung: () => T !== Tcu, khiLoiGiai: lg => capLoiGiai(cau, lg) }); // lỗi mạng: tự gửi lại cùng mã lượt; chấm nhanh: có kết quả ngay
      clearTimeout(henManh); clearTimeout(henCho);
      const con = ch.toiThieuGiay * 1000 - (bayGio() - t0);
      if (tl && con > 0) await ngu(con);
      if (daBaoCho) { hienChoMang(false); if (tl) tl.choMang(false); }
      return kq;
    }
    // chấm nhanh (12/11/2026): lời giải về sau kết quả (máy chủ chấm ở nền) -> điền vào khi tới
    function capLoiGiai(cau, lg) {
      if (!lg) return;
      cau.loiGiai = lg;
      const e = cau === cauNay && $("cKetQua").querySelector(".loi-giai");
      if (e) e.textContent = "💡 " + lg;
    }
    function hienChoMang(bat) {
      let d = $("cKetQua").querySelector(".cho-mang");
      if (!bat) { if (d) d.remove(); return; }
      if (!d) { d = document.createElement("div"); d.className = "cho-mang"; $("cKetQua").appendChild(d); }
      d.textContent = "Đang chờ mạng...";
    }
    const tuLuc = vai => (san3d && san3d.tuLuc ? san3d.tuLuc(vai) : null);

    // ---------- lưu ở máy này ----------
    function docLuu() { try { return JSON.parse(localStorage.getItem(KHOA) || "null"); } catch (e) { return null; } }
    function luu() { try { localStorage.setItem(KHOA, JSON.stringify({ chon, hs })); } catch (e) { /* trình duyệt chặn lưu: vẫn chơi được */ } }

    // Đọc to từ tiếng Anh (dạng "nghe đọc chọn từ")
    function docTo(amThanh) {
      const m = /^doc:en:(.+)$/.exec(amThanh || "");
      if (!m || !window.speechSynthesis) return;
      try {
        speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(m[1]); u.lang = "en-US"; u.rate = 0.85;
        const am = san3d && san3d.am; // nhạc nền nhỏ lại khi máy đọc (TC_D05B3)
        if (am) { am.giamNhac(true); u.onend = u.onerror = () => am.giamNhac(false); }
        speechSynthesis.speak(u);
      } catch (e) { /* máy không đọc được */ }
    }

    // ---------- hộp chọn trận ----------
    function veQuaiNho(cv, ma) {
      const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      cv.width = Math.max(1, r.width * dpr); cv.height = Math.max(1, r.height * dpr);
      const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, r.width, r.height);
      VQ.ve(c, ma, { x: r.width / 2, y: r.height - 6, co: (r.height - 12) / 140, t: 0.5, huong: -1 });
    }
    function moChon(dongDuoc) {
      $("manChon").classList.remove("an");
      $("nutDongChon").classList.toggle("an", !dongDuoc);
      document.querySelectorAll("#chonQuai button").forEach(b => { b.setAttribute("aria-pressed", String(b.dataset.ma === chon.quai)); veQuaiNho(b.querySelector("canvas"), b.dataset.ma); });
      document.querySelectorAll("#chonCl button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.ma === chon.cl)));
      $("chonLv").value = chon.lv; $("chonLop").value = chon.lop; $("chonGioi").value = chon.gioi || "nam";
      $("chonThongTha").checked = chon.thongTha != null ? chon.thongTha : chon.lop <= chTran.thongTha.denLop;
    }
    function dungHopChon() {
      QU.dsLoai(chTran).forEach(ma => {
        const l = chTran.quai.loai[ma], b = document.createElement("button");
        b.dataset.ma = ma;
        b.innerHTML = "<canvas></canvas><span></span><small></small>";
        b.querySelector("span").textContent = l.ten;
        b.querySelector("small").textContent = l.mon === "bat_ky" ? "Mọi môn" : TEN_MON[l.mon];
        b.addEventListener("click", () => { chon.quai = ma; document.querySelectorAll("#chonQuai button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
        $("chonQuai").appendChild(b);
      });
      Object.keys(TEN_CL).forEach(ma => {
        const b = document.createElement("button"); b.dataset.ma = ma; b.textContent = TEN_CL[ma];
        b.addEventListener("click", () => { chon.cl = ma; document.querySelectorAll("#chonCl button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
        $("chonCl").appendChild(b);
      });
      for (let i = 1; i <= 10; i++) { const o = document.createElement("option"); o.value = i; o.textContent = "Lv " + i; $("chonLv").appendChild(o); }
      for (let i = 1; i <= 12; i++) { const o = document.createElement("option"); o.value = i; o.textContent = "Lớp " + i; $("chonLop").appendChild(o); }
      $("chonLop").addEventListener("change", () => { $("chonThongTha").checked = +$("chonLop").value <= chTran.thongTha.denLop; });
      $("nutVaoTran").addEventListener("click", () => {
        const lopMoi = +$("chonLop").value;
        chon.lv = +$("chonLv").value;
        chon.gioi = $("chonGioi").value;
        const macDinh = lopMoi <= chTran.thongTha.denLop;
        chon.thongTha = $("chonThongTha").checked === macDinh ? null : $("chonThongTha").checked;
        if (!hs || hs.lop !== lopMoi) hs = TD.taoHoSo(lopMoi, chTD);
        chon.lop = lopMoi;
        luu();
        $("manChon").classList.add("an");
        vaoTran();
      });
      $("nutDongChon").addEventListener("click", () => $("manChon").classList.add("an"));
    }

    // ---------- TC_D06C2g: trận trụ ----------
    // T giả: cùng các hàm trang dùng (be, quai, luot, dangLuot, ketThuc, capNhat, quaiDaBam...), kết quả lượt do máy chủ trả
    let tru = null; // { luot { so, tanCong, han, tTru?, daGui, beDung, tBam }, ket, tk }
    function taoTranTru() {
      const so = k => Math.max(0, Math.round(Number(TS.get(k)) || 0));
      const be = { hp: so("mauBe"), hpToiDa: Math.max(1, so("mauBeToiDa")), mp: 0, mpToiDa: 1, combo: 0 };
      const q = { ten: TS.get("tenTru") || "Trụ tên", lv: so("cap") || 1, hp: so("mauTru"), hpToiDa: Math.max(1, so("mauTruToiDa")), mp: 0, mpToiDa: 1, combo: 0, mon: "bat_ky" };
      tru = { luot: null, ket: null, tk: { soLuot: 0, beDung: 0, beBam: 0, comboCaoNhat: 0, satThuongGay: 0, satThuongNhan: 0 } };
      return {
        be: () => be, quai: () => q, giayBe: Number(TS.get("giayBe")) || 15, // giây (đồng hồ lượt bé)
        luot: () => tru.luot && { so: tru.luot.so, tanCong: tru.luot.tanCong, han: tru.luot.han, thongTha: false },
        dangLuot: () => !!tru.luot && !tru.luot.daGui && !tru.ket,
        ketThuc: () => tru.ket, tongKet: () => Object.assign({}, tru.tk),
        quaiDaBam: () => false,
        capNhat(t) { // hết giờ bé (lượt bé) / tới lúc trụ bấm (lượt trụ): gửi máy chủ
          const l = tru.luot;
          if (!l || l.daGui || tru.ket) return null;
          if (l.tanCong === "be" && t > l.han && l.daChon == null) guiTru({ chon: null });
          else if (l.tanCong === "quai" && t >= l.tTru) {
            // KC_06B2: câu kho -> chờ máy chủ chấm xong (bé đã bấm) hoặc xin lật bài (bé chưa bấm) rồi mới gửi lượt trụ
            if (cauNay && cauNay.kho && !l.daCham) {
              if (l.daChon == null && !l.choLat) { l.choLat = true; const so = l.so; chamKho(cauNay, null, l.tMo, null).then(kq => { if (tru.luot && tru.luot.so === so) xongChamTru(kq, null); }); }
              return null;
            }
            guiTru({ beDung: !!l.beDung });
          }
          return null;
        },
        beBam: () => ({ nhan: false })
      };
    }
    function vaoTranTru() {
      $("manKet").classList.add("an");
      T = taoTranTru();
      chuQuai = "";
      hieuUng = null; ketThucLuc = 0; clearTimeout(henTiep);
      $("tenBe").textContent = TS.get("tl") || "Thủ lĩnh";
      $("tenQuai").innerHTML = "<small></small> "; $("tenQuai").querySelector("small").textContent = "Lv " + T.quai().lv;
      $("tenQuai").appendChild(document.createTextNode(T.quai().ten));
      if (san3d) san3d.datTran({ hoSo: hoSoBe(), quai: chon.quai, chu: "", doiThu: chon.doiThu });
      veThanh();
      moLuotMoi();
    }
    function hienCau(c, beDanh) {
      $("bangLuot").classList.remove("an");
      $("bangLuot").classList.toggle("quai", !beDanh);
      $("bangLuot").textContent = beDanh ? "⚔️ Tấn công" : "🛡️ Phòng thủ";
      if (san3d) san3d.nghi(!beDanh);
      const hinh = $("cHinh"); hinh.textContent = c.hinhChu || "";
      hinh.classList.toggle("an", !c.hinhChu);
      $("cNoiDung").textContent = c.noiDung;
      $("nutNghe").classList.toggle("an", !c.amThanh);
      docTo(c.amThanh);
      $("cDapAn").innerHTML = "";
      c.dapAn.forEach((d, i) => { const b = document.createElement("button"); b.textContent = d; b.addEventListener("click", () => beBam(i)); $("cDapAn").appendChild(b); });
      $("cKetQua").innerHTML = "";
    }
    async function moLuotTru(lan) {
      clearTimeout(henTiep); beThu = false; quaiThu = false;
      const kq = await hoiBanDo("luot", {});
      if (!kq.ok) {
        if (kq.ma === "het_tran" || (lan || 0) >= 3) { baoBanDo({ loai: "dt-tran-dong", hpBe: T.be().hp }); return; }
        $("cKetQua").textContent = "⚠️ " + (kq.lyDo || "Mất kết nối") + " · đang thử lại…";
        henTiep = setTimeout(() => moLuotTru((lan || 0) + 1), 2000); return;
      }
      const l = kq.luot, t = bayGio();
      if (l.ben === "tru") { // trụ tấn công: câu theo trình độ của bé (bé phòng thủ), trụ bấm sau giayTru giây. KC_06B2: câu kho, máy chủ chấm
        const ds = Object.keys(NG), mon = ds[Math.floor(Math.random() * ds.length)];
        const x = await layCau(mon);
        if (!x || !x.cau) { $("cKetQua").textContent = "⚠️ Chưa lấy được câu hỏi · đang thử lại…"; henTiep = setTimeout(() => moLuotTru(lan), 2500); return; }
        cauNay = x.cau;
        const t1 = bayGio();
        tru.luot = { so: l.so, tanCong: "quai", tMo: t1, tTru: t1 + (Number(l.giayTru) || 4) * 1000, han: t1 + (Number(l.giayTru) || 4) * 1000, daGui: false };
        hienCau(cauNay, false);
      } else { // bé tấn công: câu của trụ (máy chủ không gửi đáp án)
        cauNay = Object.assign({ dung: [], loiGiai: "" }, l.cau || { noiDung: "…", dapAn: [] });
        tru.luot = { so: l.so, tanCong: "be", tMo: t, han: t + (Number(l.han) || 15) * 1000, daGui: false };
        hienCau(cauNay, true);
      }
      capNhatDongHo();
    }
    function beBamTru(i) {
      const l = tru && tru.luot;
      if (!l || l.daGui || l.daChon != null || tru.ket) return;
      l.daChon = i;
      const nut = $("cDapAn").children;
      for (let j = 0; j < nut.length; j++) nut[j].disabled = true;
      if (nut[i]) nut[i].classList.add("da-chon");
      tru.tk.beBam++;
      if (l.tanCong === "be") { l.tl = tuLuc("danh"); l.tBam = bayGio(); guiTru({ chon: i }); return; } // KC_06B2: tụ lực trong lúc máy chủ chấm
      if (cauNay.kho) { // KC_06B2: câu kho -> khiên tụ sáng, máy chủ chấm
        const tl = tuLuc("thu"), so = l.so;
        chamKho(cauNay, i, l.tMo, tl).then(kq => { if (tru.luot && tru.luot.so === so) xongChamTru(kq, tl); });
        return;
      }
      // phòng thủ: câu của bé, chấm ngay tại máy; đúng thì vào thế thủ, trụ bấm sớm hơn (bé khỏi chờ)
      l.beDung = cauNay.dung.indexOf(i) >= 0;
      bo.traLoi(hs, cauNay, i); luu();
      if (l.beDung) { tru.tk.beDung++; beThu = true; if (san3d) san3d.thu("be", true); }
      l.tTru = Math.min(l.tTru, bayGio() + chTran.tuaKhiDaBamGiay * 1000);
    }
    // KC_06B2: máy chủ chấm xong câu phòng thủ (lượt trụ tấn công)
    function xongChamTru(kq, tl) {
      const l = tru.luot;
      cauNay.dung = [kq.dapAnDung]; cauNay.loiGiai = kq.loiGiai || "";
      l.daCham = true; l.beDung = !!kq.dung && l.daChon != null;
      if (l.daChon != null && !kq.loi) { bo.ghiKetQua(hs, cauNay, kq.dung); luu(); }
      if (tl) { if (l.beDung) tl.bung(); else tl.tan(); }
      if (l.beDung) { tru.tk.beDung++; beThu = true; if (san3d) san3d.thu("be", true); }

      }
      if (san3d || !W || !H) return;
      // nền: trời + đồi + bãi cỏ
      const g = c2.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#2b4c9a"); g.addColorStop(0.55, "#6ea0d8"); g.addColorStop(0.56, "#4f8f4a"); g.addColorStop(1, "#2f5f33");
      c2.fillStyle = g; c2.fillRect(0, 0, W, H);
      c2.fillStyle = "#3f7a45"; c2.beginPath(); c2.moveTo(0, H * 0.58); c2.quadraticCurveTo(W * 0.25, H * 0.44, W * 0.5, H * 0.56); c2.quadraticCurveTo(W * 0.78, H * 0.46, W, H * 0.57); c2.lineTo(W, H); c2.lineTo(0, H); c2.fill();
      const dat = H * 0.88;
      c2.fillStyle = "rgba(255,255,255,.06)"; c2.beginPath(); c2.ellipse(W / 2, dat + 4, W * 0.42, H * 0.06, 0, 0, Math.PI * 2); c2.fill();
      if (!T) return;
      const coNV = Math.min(H * 0.5 / NV.CAO, W * 0.22 / 40), coQ = Math.min(H * 0.5 / 110, W * 0.28 / 110);
      let xBe = W * 0.27, xQ = W * 0.73, moBe = 1, moQ = 1, tuThe = "dung", ngaBe = 0;
      // hiệu ứng lượt
      const hu = hieuUng, dt = hu ? (now - hu.t0) / 1000 : 9;
      if (hu && dt < 1) {
        const lao = dt < 0.3 ? Math.sin(dt / 0.3 * Math.PI) : 0;
        if (hu.danh === "be") { xBe += lao * W * 0.18; tuThe = "chat"; } else xQ -= lao * W * 0.18;
        if (dt > 0.2 && dt < 0.65) {
          const p = (dt - 0.2) / 0.45;
          if (hu.loai === "trung") { const day = Math.sin(p * Math.PI) * W * 0.04; if (hu.do === "be") xBe -= day; else xQ += day; }
          if (hu.loai === "ne") { const ne = Math.sin(p * Math.PI) * W * 0.07; if (hu.do === "be") xBe -= ne; else xQ += ne; }
        }
      }
      const kt = T.ketThuc();
      if (kt && ketThucLuc) {
        const p = Math.min(1, (now - ketThucLuc) / 1400);
        if (kt.thang === "be" || kt.thang === null) { xQ += p * W * 0.4; moQ = 1 - p; }
        if (kt.thang === "quai") { moBe = 1 - p * 0.45; ngaBe = p; }
      }
      const yBay = hu && hu.loai === "ne" && dt > 0.2 && dt < 0.65 ? Math.sin((dt - 0.2) / 0.45 * Math.PI) * H * 0.06 : 0;
      // Thủ lĩnh
      c2.save(); c2.globalAlpha = moBe;
      if (ngaBe) { c2.translate(xBe, dat); c2.rotate(-ngaBe * 0.5); c2.translate(-xBe, -dat); }
      NV.ve(c2, { chungLoai: chon.cl, gioi: chon.gioi || "nam" }, { x: xBe, y: dat - (hu && hu.do === "be" ? yBay : 0), co: coNV, huong: 1, t, tuThe, cam: "gay" });
      c2.restore();
      // quái
      VQ.ve(c2, chon.quai, { x: xQ, y: dat - (hu && hu.do === "quai" ? yBay : 0), co: coQ, t, huong: -1, chu: chuQuai, mo: moQ });
      // chớp sáng khi trúng
      if (hu && hu.loai === "trung" && dt > 0.25 && dt < 0.5) {
        const x = hu.do === "be" ? xBe : xQ, a = 1 - (dt - 0.25) / 0.25;
        c2.save(); c2.globalAlpha = a; const fl = c2.createRadialGradient(x, dat - H * 0.25, 2, x, dat - H * 0.25, H * 0.3);
        fl.addColorStop(0, "rgba(255,255,255,.95)"); fl.addColorStop(1, "rgba(255,240,180,0)"); c2.fillStyle = fl; c2.fillRect(x - H * 0.3, dat - H * 0.55, H * 0.6, H * 0.6);
        for (let i = 0; i < 6; i++) { const goc = i * Math.PI / 3 + dt * 6, r = H * 0.12 + (dt - 0.25) * H * 0.6; c2.fillStyle = "#ffe066"; c2.font = Math.round(H * 0.06) + "px sans-serif"; c2.fillText("★", x + Math.cos(goc) * r, dat - H * 0.25 + Math.sin(goc) * r); }
        c2.restore();
      }
      // vòng thế thủ, bóng suy nghĩ
      if (T.dangLuot()) {
        const info = T.luot();
        if (info.tanCong === "quai") {
          if (beThu) vongThu(xBe, dat - NV.CAO * coNV * 0.5, NV.CAO * coNV * 0.62, "#ffd75e");
          bongNghi(xQ + coQ * 30, dat - coQ * 120, t);
        } else if (T.quaiDaBam(now)) vongThu(xQ, dat - coQ * 50, coQ * 70, "#ff9b9b");
      }
    }

    // ---------- khởi động ----------
    async function khoiDong(ch, chTd, khoTu) {
      if (!ch) { $("cNoiDung").textContent = "Không nạp được cài đặt trận đấu. Tải lại trang."; return; }
      chTran = ch; chTD = TD.cauHinh(chTd);
      if (ch.tuLuc) tuLucCh = Object.assign({}, tuLucCh, ch.tuLuc); // KC_06B2: số tụ lực (Quản trị › Thông số › Trận đấu)
      const ngSinh = {};
      if (ST) ngSinh.toan = ST;
      if (khoTu && TA) { try { ngSinh.tieng_anh = TA.tao(khoTu, chTD); } catch (e) { console.warn("Không dựng được câu Tiếng Anh", e); } }
      if (KHO) { // KC_06B2: câu kho chung, máy chủ chấm
        const gia = NHUNG ? null : NK.khoGia(ngSinh, { soMoiO: 8, chamMs: Math.max(0, Number(TS.get("tre")) || 0), nhanh: TS.get("nhanh") !== "0" });
        kho = NK.tao({ goi: gia ? gia.goi : hoiKho, gapO: TRU ? "dau_truong_tru" : "dau_truong_quai" });
        for (let lan = 0; !(await kho.batDau()); lan++) {
          $("cNoiDung").textContent = "⚠️ Chưa lấy được câu hỏi. Đang thử lại…";
          if (NHUNG) { $("nutRutLui").classList.remove("an"); if (!$("nutRutLui").dataset.gan) { $("nutRutLui").dataset.gan = "1"; $("nutRutLui").addEventListener("click", () => baoBanDo({ loai: "dt-tran-dong" })); } }
          await ngu(Math.min(8000, 2000 + lan * 1500));
        }
        $("cNoiDung").textContent = "";
        NG = kho.nguon;
      } else NG = ngSinh;
      bo = CH.taoBoChon(chTD, NG);
      const cu = docLuu();
      if (cu && cu.chon && chTran.quai.loai[cu.chon.quai]) {
        chon = Object.assign(chon, cu.chon);
        chon.lop = Math.max(1, Math.min(12, +chon.lop || 2)); chon.lv = Math.max(1, Math.min(10, +chon.lv || 1));
        if (!chTran.thuLinh[chon.cl]) chon.cl = "nhan";
        if (cu.hs) hs = TD.chuanHoa(cu.hs, chTD);
      }
      if (NHUNG) { // trận thật từ bản đồ: quái + cấp + Thủ lĩnh theo tham số
        const q = TS.get("quai");
        chon = { quai: chTran.quai.loai[q] ? q : "slime_so", lv: Math.max(1, Math.min(10, +TS.get("lv") || 1)), lop: Math.max(1, Math.min(12, +TS.get("lop") || 2)),
          cl: chTran.thuLinh[TS.get("cl")] ? TS.get("cl") : "nhan", gioi: TS.get("gioi") === "nu" ? "nu" : "nam", thongTha: null };
        if (TRU) chon.quai = /^(tru|ct)_\w+$/.test(TS.get("loaiTru") || "") ? TS.get("loaiTru") : "tru_ten"; // TC_D06C2g: đối thủ là trụ (sân 3D dt3d_quai.js); TC_D06C7b: ct_rao / ct_nha = công trình thường
        // TC_D06C7b (người dùng 08/11/2026): đánh công trình thường -> đối thủ trên sân là Thủ lĩnh của chủ (&doiCl = tộc của chủ), công trình đứng sau
        chon.doiThu = TRU && /^ct_/.test(chon.quai) ? { chungLoai: chTran.thuLinh[TS.get("doiCl")] ? TS.get("doiCl") : "nhan" } : null;
        document.title = "Trận đấu - Đấu Trường Tri Thức";
        $("nutChonTran").classList.add("an"); $("nutRutLui").classList.remove("an");
        document.querySelector(".dau h1").firstChild.textContent = "⚔️ Trận đấu";
        if (!$("nutRutLui").dataset.gan) $("nutRutLui").addEventListener("click", () => { clearTimeout(henTiep); baoBanDo({ loai: "dt-tran-dong", hpBe: T ? T.be().hp : undefined }); });
        $("nutVeBanDo").addEventListener("click", () => baoBanDo({ loai: "dt-tran-dong", hpBe: T ? T.be().hp : undefined }));
      }
      if (!hs || hs.lop !== chon.lop) hs = TD.taoHoSo(chon.lop, chTD);
      const m = /#quai=(\w+)/.exec(location.hash); if (!NHUNG && m && chTran.quai.loai[m[1]]) chon.quai = m[1];
      dungHopChon();
      $("nutChonTran").addEventListener("click", () => moChon(true));
      // chạm khung câu hỏi lúc lật bài: sang lượt ngay
      document.querySelector(".cau").addEventListener("click", e => { if (e.target.closest("#cDapAn")) return; if (T && !T.dangLuot() && !T.ketThuc() && henTiep) { clearTimeout(henTiep); henTiep = 0; moLuotMoi(); } });
      $("nutNghe").addEventListener("click", () => cauNay && docTo(cauNay.amThanh));
      $("nutDauLai").addEventListener("click", vaoTran);
      $("nutDoiTran").addEventListener("click", () => { $("manKet").classList.add("an"); moChon(false); });
      $("nutBoNghi").addEventListener("click", boNghi);
      document.addEventListener("keydown", e => {
        if (!$("manChon").classList.contains("an") || !$("manKet").classList.contains("an")) return;
        if (/^[1-4]$/.test(e.key)) beBam(+e.key - 1);
        else if (e.key === "Enter" && T && !T.dangLuot() && !T.ketThuc() && henTiep) { clearTimeout(henTiep); henTiep = 0; moLuotMoi(); }
      });
      if (NHUNG || /#vao/.test(location.hash)) vaoTran(); else moChon(false);
      requestAnimationFrame(ve);
    }

    // Sân 3D (cùng bộ hình với làng). Không có WebGL / tải lỗi / quá 15 giây: vẽ 2D trên canvas.
    function batSan3d() {
      const ve2d = () => { $("dangTai").classList.add("an"); };
      if (/2d/.test(location.hash)) return ve2d();
      const thu = () => window.KC_DT_SAN3D.tao($("san3d")).then(s => {
        san3d = s; $("canvas").classList.add("an"); $("dangTai").classList.add("an");
        batNutChieu(); batNutTieng();
        if (T) { san3d.datTran({ hoSo: hoSoBe(), quai: chon.quai, chu: chuQuai, doiThu: chon.doiThu }); if (T.dangLuot()) san3d.nghi(T.luot().tanCong === "quai"); }
      }).catch(e => { console.warn("Không dựng được sân 3D, dùng hình 2D", e); ve2d(); });
      if (window.KC_DT_SAN3D) thu();
      else { window.addEventListener("dt-san3d", thu, { once: true }); setTimeout(() => { if (!san3d) ve2d(); }, 15000); }
    }

    // nút thử chiêu lớn (TC_D05B2): chỉ để xem hiệu ứng, không tính vào trận; TC_D05C gắn chiêu vào kỹ năng
    function batNutChieu() {
      if (NHUNG) return; // trận thật: không có nút thử chiêu (TC_D05C gắn chiêu vào kỹ năng)
      const hang = $("chieuThu"); hang.classList.remove("an");
      const nut = [...hang.querySelectorAll("button")];
      const bam = (b, giay) => {
        if (!giay) return;
        nut.forEach(x => { x.disabled = true; });
        setTimeout(() => nut.forEach(x => { x.disabled = false; }), giay * 1000);
      };
      nut.forEach(b => b.addEventListener("click", () => bam(b, san3d.chieuVung(b.dataset.ma))));
      // nút của kho chiêu thêm (3d/dt3d_chieu_them.js, phụ tá làm): tự hiện theo danh sách trong file
      san3d.dsChieuThem().then(ds => ds.forEach(c => {
        const b = document.createElement("button"); b.dataset.them = c.ma; b.textContent = c.nut || c.ma;
        b.addEventListener("click", () => bam(b, san3d.chieuThem(c.ma)));
        hang.appendChild(b); nut.push(b);
      }));
    }

    // nút 🔊 / 🔇 (TC_D05B3): tắt / bật mọi tiếng chiến đấu, máy nhớ lựa chọn
    function batNutTieng() {
      const n = $("nutTieng"), am = san3d.am; if (!am) return;
      const ve = () => { const b = am.dangBat(); n.textContent = b ? "🔊" : "🔇"; n.title = b ? "Tắt tiếng" : "Bật tiếng"; n.setAttribute("aria-label", n.title); };
      n.addEventListener("click", () => { am.datBat(!am.dangBat()); ve(); });
      ve(); n.classList.remove("an");
    }

    window.__dtTran = { tran: () => T, cau: () => cauNay, san: () => san3d }; // cho kịch bản thử Chrome biết trạng thái

    const nap = u => fetch(u, { cache: "no-cache" }).then(r => r.json()).catch(() => null);
    const napJs = u => new Promise(x => { const sc = document.createElement("script"); sc.src = u; sc.onload = sc.onerror = () => x(); document.head.appendChild(sc); });
    // KC_06B2: trận thật lấy số Quản trị đã sửa (Thông số › Trận đấu / Độ khó) qua bản đồ; trang thử (không có bản đồ) đọc số mặc định.
    // Bộ sinh câu + kho từ chỉ trang thử mới nạp (trang thật hỏi câu kho, không sinh câu).
    const napCh = ten => NHUNG ? hoiKho("cauHinh", { ten }).then(k => k && k.ok && k.ch ? k.ch : nap("du_lieu/" + ten + ".json")) : nap("du_lieu/" + ten + ".json");
    const napSinh = NHUNG ? Promise.resolve([null]) : Promise.all([nap("../tu_vung/kho_tu.json"), napJs("dt_sinh_toan.js"), napJs("dt_sinh_tieng_anh.js")]).then(([kt]) => {
      ST = window.KC_DT_SINH_TOAN || null; TA = window.KC_DT_SINH_TA || null; return [kt];
    });
    batSan3d(); // KC_06B2 (sửa 12/11): tải sân 3D + tướng NGAY, song song với số Quản trị + câu kho (trước đây chờ xong mới tải)
    Promise.all([napCh("cau_hinh_tran_dau"), napCh("cau_hinh_trinh_do"), napSinh]).then(([a, b, [c]]) => khoiDong(a, b, c));
  })();
  </script>
