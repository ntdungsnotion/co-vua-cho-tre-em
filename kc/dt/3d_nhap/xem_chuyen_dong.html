<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Xem Thử Nghiệm Mô Hình 3D Gắn Xương & Chuyển Động</title>
  <!-- ================================================================
       FILE: dt/3d_nhap/xem_chuyen_dong.html
       CHỨC NĂNG: Trang xem thử nghiệm 3D tương tác mô hình nhân vật mới
                  (Vua Nhân Tộc Đời 2) đã được gắn xương & thừa hưởng 100%
                  bộ chuyển động hoạt hình chuẩn của Claude Code (KayKit).
       TÁC GIẢ: Antigravity (AI Phụ tá)
       NGÀY: 25/10/2026 15:20
       ================================================================ -->
  <style>
    :root {
      --nen: #0a0e17;
      --panel: rgba(16, 24, 40, 0.92);
      --vien: rgba(255, 194, 75, 0.4);
      --chu-chinh: #f8fafc;
      --chu-phu: #94a3b8;
      --vang: #f59e0b;
      --xanh: #10b981;
      --tim: #8b5cf6;
      --do: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--chu-chinh);
      user-select: none;
    }
    #san3d {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    #san3d:active { cursor: grabbing; }

    /* Bảng điều khiển */
    .bang-dieu-khien {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 320px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--vien);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
    }
    .bang-dieu-khien::-webkit-scrollbar { width: 5px; }
    .bang-dieu-khien::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }

    .tieu-de {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--vang);
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .tieu-de span { font-size: 1.3rem; }

    .nhom-nut {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .nhom-nhan {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--chu-phu);
      font-weight: 600;
    }

    select, button {
      font: inherit;
      color: var(--chu-chinh);
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 8px 12px;
      outline: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    select:hover, button:hover {
      border-color: var(--vang);
      background: #334155;
    }
    select {
      width: 100%;
    }

    .luoi-nut-dong-tac {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .nut-dt {
      font-size: 0.85rem;
      padding: 8px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 6px;
      border-radius: 6px;
    }
    .nut-dt.active {
      background: #d97706;
      border-color: var(--vang);
      font-weight: 600;
    }

    /* Thanh trượt */
    .hang-truot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .hang-truot label { font-size: 0.85rem; }
    .hang-truot span { font-size: 0.85rem; font-weight: 600; color: var(--vang); min-width: 40px; text-align: right; }
    input[type="range"] {
      flex: 1;
      accent-color: var(--vang);
      cursor: pointer;
    }

    /* Khung thông số */
    .khung-thong-so {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.8rem;
      color: var(--chu-phu);
      line-height: 1.5;
    }
    .khung-thong-so b { color: var(--chu-chinh); }

    /* Màn hình tải */
    #manHinhTai {
      position: absolute;
      inset: 0;
      background: rgba(10, 14, 23, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 100;
      transition: opacity 0.3s ease;
    }
    .vong-quay {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--vang);
      border-radius: 50%;
      animation: quay 0.8s linear infinite;
    }
    @keyframes quay { to { transform: rotate(360deg); } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "../../thu_vien/three/three.module.min.js"
      }
    }
  </script>
</head>
<body>
  <div id="san3d"></div>

  <div id="manHinhTai">
    <div class="vong-quay"></div>
    <div id="chuTai" style="font-weight: 500; font-size: 0.95rem;">Đang nạp mô hình 3D…</div>
  </div>

  <div class="bang-dieu-khien">
    <div class="tieu-de">
      <span>👑</span>
      <div>Kiểm Thử Chuyển Động 3D</div>
    </div>

    <!-- Chọn mô hình -->
    <div class="nhom-nut">
      <div class="nhom-nhan">Mô hình nhân vật</div>
      <select id="selMoHinh">
        <option value="mo_hinh/vua_doi2_chuyen_dong.glb">Vua Nhân Tộc Đời 2 (Mới)</option>
        <option value="mo_hinh/nhan_vat.glb">Mô hình KayKit Gốc (Đối chiếu)</option>
      </select>
    </div>

    <!-- Danh sách động tác -->
    <div class="nhom-nut">
      <div class="nhom-nhan">Động tác (Animations)</div>
      <div class="luoi-nut-dong-tac" id="dsDongTac">
        <!-- Render bằng JS -->
      </div>
    </div>

    <!-- Tốc độ động tác -->
    <div class="nhom-nut">
      <div class="hang-truot">
        <label>Tốc độ:</label>
        <input type="range" id="truotTocDo" min="0.1" max="2.0" step="0.05" value="1.0">
        <span id="soTocDo">1.0x</span>
      </div>
    </div>

    <!-- Góc máy camera -->
    <div class="nhom-nut">
      <div class="nhom-nhan">Góc nhìn Camera</div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
        <button id="btnGocToanThan">Toàn thân</button>
        <button id="btnGocMat">Khuôn mặt</button>
        <button id="btnGocDeChe">Góc Đế Chế</button>
        <button id="btnGocReset">Đặt lại</button>
      </div>
    </div>

    <!-- Tùy chọn hiển thị -->
    <div class="nhom-nut">
      <div class="nhom-nhan">Tùy chọn hiển thị</div>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer;">
        <input type="checkbox" id="chkXuong"> Hiện khung xương (Skeleton)
      </label>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer;">
        <input type="checkbox" id="chkSan" checked> Hiện sàn lưới & bóng đổ
      </label>
    </div>

    <!-- Thông số kỹ thuật -->
    <div class="khung-thong-so" id="thongSo">
      Đang tải…
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "../../thu_vien/three/loaders/GLTFLoader.js";

    // ── 1. Khởi tạo Khung cảnh Three.js ──────────────────────────────────────────
    const san = document.getElementById("san3d");
    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.4, 3.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    san.appendChild(renderer.domElement);

    // ── 2. Ánh sáng Studio ────────────────────────────────────────────────────────
    const ambient = new THREE.AmbientLight(0xffffff, 1.6);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xfff5ea, 2.2);
    sun.position.set(4, 8, 4);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 1024;
    sun.shadow.mapSize.height = 1024;
    sun.shadow.bias = -0.0005;
    scene.add(sun);

    const fillLight = new THREE.DirectionalLight(0xb9c3ec, 1.2);
    fillLight.position.set(-4, 3, -3);
    scene.add(fillLight);

    // ── 3. Sàn lưới & Bóng ────────────────────────────────────────────────────────
    const grid = new THREE.GridHelper(10, 20, 0xf59e0b, 0x334155);
    grid.position.y = 0;
    scene.add(grid);

    const floorGeo = new THREE.PlaneGeometry(12, 12);
    const floorMat = new THREE.ShadowMaterial({ opacity: 0.35 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // ── 4. Camera Orbit tùy biến mượt mà ────────────────────────────────────────
    let isDragging = false;
    let prevMouse = { x: 0, y: 0 };
    let theta = 0, phi = Math.PI / 2 - 0.2, radius = 3.8;
    const target = new THREE.Vector3(0, 0.95, 0);

    function capNhatCamera() {
      phi = Math.max(0.05, Math.min(Math.PI / 2 - 0.02, phi));
      radius = Math.max(0.8, Math.min(10, radius));
      camera.position.x = target.x + radius * Math.sin(phi) * Math.sin(theta);
      camera.position.y = target.y + radius * Math.cos(phi);
      camera.position.z = target.z + radius * Math.sin(phi) * Math.cos(theta);
      camera.lookAt(target);
    }
    capNhatCamera();

    san.addEventListener("pointerdown", e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
    window.addEventListener("pointerup", () => isDragging = false);
    window.addEventListener("pointermove", e => {
      if (!isDragging) return;
      const dx = e.clientX - prevMouse.x;
      const dy = e.clientY - prevMouse.y;
      prevMouse = { x: e.clientX, y: e.clientY };
      theta -= dx * 0.008;
      phi   -= dy * 0.008;
      capNhatCamera();
    });
    san.addEventListener("wheel", e => {
      radius += e.deltaY * 0.003;
      capNhatCamera();
      e.preventDefault();
    }, { passive: false });

    // ── 5. Nạp Mô hình & Animation ──────────────────────────────────────────────
    const loader = new GLTFLoader();
    let currentModel = null;
    let mixer = null;
    let actions = {};
    let activeAction = null;
    let skeletonHelper = null;

    const DONG_TAC_VIET = {
      "Walking_A": "🚶 Đi bộ",
      "Running_A": "🏃 Chạy nhanh",
      "Idle": "🧘 Đứng chờ",
      "1H_Melee_Attack_Chop": "🪓 Chặt cây",
      "2H_Melee_Attack_Chop": "⛏️ Đào mỏ",
      "PickUp": "🍎 Hái lượm",
      "Cheer": "🎉 Ăn mừng",
      "Interact": "💬 Nói chuyện"
    };

    const manHinhTai = document.getElementById("manHinhTai");
    const chuTai = document.getElementById("chuTai");
    const dsDongTac = document.getElementById("dsDongTac");
    const thongSo = document.getElementById("thongSo");
    const chkXuong = document.getElementById("chkXuong");

    async function napMoHinh(url) {
      manHinhTai.style.display = "flex";
      chuTai.textContent = "Đang tải mô hình…";

      if (currentModel) {
        scene.remove(currentModel);
        if (skeletonHelper) scene.remove(skeletonHelper);
        currentModel = null;
      }

      try {
        const gltf = await new Promise((ok, err) => loader.load(url, ok, e => {
          if (e.total) chuTai.textContent = `Đang tải… ${Math.round(e.loaded / e.total * 100)}%`;
        }, err));

        currentModel = gltf.scene;
        scene.add(currentModel);

        let totalPolys = 0;
        let totalBones = 0;
        currentModel.traverse(o => {
          if (o.isMesh) {
            o.castShadow = true;
            o.receiveShadow = true;
            if (o.geometry.index) totalPolys += o.geometry.index.count / 3;
            else if (o.geometry.attributes.position) totalPolys += o.geometry.attributes.position.count / 3;
          }
          if (o.isBone) totalBones++;
        });

        // Tạo Skeleton Helper
        skeletonHelper = new THREE.SkeletonHelper(currentModel);
        skeletonHelper.material.linewidth = 2;
        skeletonHelper.visible = chkXuong.checked;
        scene.add(skeletonHelper);

        // Animation Mixer
        mixer = new THREE.AnimationMixer(currentModel);
        actions = {};
        dsDongTac.innerHTML = "";

        const clips = gltf.animations;
        clips.forEach(clip => {
          const action = mixer.clipAction(clip);
          actions[clip.name] = action;

          const btn = document.createElement("button");
          btn.className = "nut-dt";
          btn.innerHTML = DONG_TAC_VIET[clip.name] || clip.name;
          btn.onclick = () => batDongTac(clip.name);
          btn.id = "btn_dt_" + clip.name;
          dsDongTac.appendChild(btn);
        });

        // Đổi động tác mặc định
        if (actions["Idle"]) batDongTac("Idle");
        else if (clips[0]) batDongTac(clips[0].name);

        thongSo.innerHTML = `
          <b>Số tam giác (Poly):</b> ${Math.round(totalPolys).toLocaleString()}<br>
          <b>Số khớp xương:</b> ${totalBones} bones<br>
          <b>Số động tác có sẵn:</b> ${clips.length} animations<br>
          <b>Định dạng:</b> glTF 2.0 Binary (.glb)
        `;

        manHinhTai.style.display = "none";
      } catch (err) {
        chuTai.textContent = "Lỗi khi nạp mô hình: " + err.message;
        console.error(err);
      }
    }

    function batDongTac(ten) {
      if (!actions[ten]) return;
      const moi = actions[ten];
      const cu = activeAction;

      document.querySelectorAll(".nut-dt").forEach(b => b.classList.remove("active"));
      const btn = document.getElementById("btn_dt_" + ten);
      if (btn) btn.classList.add("active");

      if (cu && cu !== moi) {
        cu.fadeOut(0.2);
      }
      moi.reset();
      moi.setEffectiveTimeScale(parseFloat(document.getElementById("truotTocDo").value));
      moi.setEffectiveWeight(1.0);
      moi.fadeIn(0.2);
      moi.play();
      activeAction = moi;
    }

    // ── 6. Sự kiện Điều khiển ────────────────────────────────────────────────────
    document.getElementById("selMoHinh").addEventListener("change", e => {
      napMoHinh(e.target.value);
    });

    const truotTocDo = document.getElementById("truotTocDo");
    const soTocDo = document.getElementById("soTocDo");
    truotTocDo.addEventListener("input", e => {
      const val = parseFloat(e.target.value);
      soTocDo.textContent = val.toFixed(1) + "x";
      if (activeAction) activeAction.timeScale = val;
    });

    chkXuong.addEventListener("change", e => {
      if (skeletonHelper) skeletonHelper.visible = e.target.checked;
    });

    document.getElementById("chkSan").addEventListener("change", e => {
      grid.visible = e.target.checked;
      floor.visible = e.target.checked;
    });

    document.getElementById("btnGocToanThan").onclick = () => {
      target.set(0, 0.95, 0);
      theta = 0; phi = Math.PI / 2 - 0.1; radius = 3.6;
      capNhatCamera();
    };
    document.getElementById("btnGocMat").onclick = () => {
      target.set(0, 1.48, 0);
      theta = 0; phi = Math.PI / 2; radius = 1.2;
      capNhatCamera();
    };
    document.getElementById("btnGocDeChe").onclick = () => {
      target.set(0, 0.8, 0);
      theta = -Math.PI / 4; phi = Math.PI / 4; radius = 5.0;
      capNhatCamera();
    };
    document.getElementById("btnGocReset").onclick = () => {
      target.set(0, 0.95, 0);
      theta = 0; phi = Math.PI / 2 - 0.2; radius = 3.8;
      capNhatCamera();
    };

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── 7. Render Loop ───────────────────────────────────────────────────────────
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      renderer.render(scene, camera);
    }
    animate();

    // Khởi động mô hình ban đầu
    napMoHinh("mo_hinh/vua_doi2_chuyen_dong.glb");

    // Expose cho kiểm thử
    window.__xem3d = {
      get activeAction() { return activeAction; },
      get mixer() { return mixer; },
      get model() { return currentModel; },
      get actions() { return actions; },
      batDongTac
    };
  </script>
</body>
</html>
