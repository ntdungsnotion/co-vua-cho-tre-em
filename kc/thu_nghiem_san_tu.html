<!DOCTYPE html>
<!--
  FILE: thu_nghiem_san_tu.html
  CHỨC NĂNG: BẢN THỬ NGHIỆM trò chơi "Săn từ tiếng Anh" (nấm chạy, nhảy qua quái vật/gai
             là CHỮ cách điệu). Trang độc lập: chưa nối tài khoản, chưa tặng kim cương,
             chưa có trong menu. Chỉ để cho bé chơi thử xem có thích không.
  BƯỚC: HT_00
-->
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Săn từ tiếng Anh (bản thử)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --chinh: #6C4CE0; --chinh-dam: #4B2FB0; --chinh-nhat: #EFE9FD;
    --vang: #FFB800; --xanh: #2BB673; --do: #E5484D; --chu: #2B2640;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #1d1640; color: var(--chu);
    font-family: "Be Vietnam Pro", system-ui, sans-serif; overflow: hidden; touch-action: manipulation; }
  h1, h2, .chuTo { font-family: "Baloo 2", system-ui, sans-serif; }
  #app { position: relative; max-width: 520px; height: 100%; margin: 0 auto; background: #FAF8FF; overflow: hidden; }
  .man { position: absolute; inset: 0; display: none; flex-direction: column; }
  .man.hien { display: flex; }
  .nut { border: 0; border-radius: 18px; font-family: "Baloo 2", sans-serif; font-weight: 800;
    font-size: 24px; padding: 14px 26px; color: #fff; background: var(--chinh);
    box-shadow: 0 6px 0 var(--chinh-dam); cursor: pointer; }
  .nut:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--chinh-dam); }
  .nut.vang { background: var(--vang); color: #5a3d00; box-shadow: 0 6px 0 #c48f00; }
  .nut.nho { font-size: 18px; padding: 10px 16px; }
  .giua { margin: auto; text-align: center; padding: 20px; }

  /* ----- màn đầu & kết quả ----- */
  #manDau { background: linear-gradient(#7fd3ff, #d9f3ff 60%, #8fe08f 60%); }
  #manDau h1 { font-size: 42px; margin: 0; color: var(--chinh-dam); text-shadow: 0 3px 0 #fff; }
  .nhanBe { font-size: 90px; animation: nhun 1s infinite alternate; }
  @keyframes nhun { to { transform: translateY(-14px) rotate(6deg); } }

  /* ----- chữ cách điệu ----- */
  .chuCD { display: inline-flex; font-family: "Baloo 2", sans-serif; font-weight: 800; line-height: 1; }
  .chuCD span { display: inline-block; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .chuCD span:nth-child(odd) { transform: rotate(-6deg); }
  .chuCD span:nth-child(even) { transform: rotate(5deg) translateY(2px); }

  /* ----- màn làm quen ----- */
  #manHoc { background: var(--chinh-nhat); }
  .theTu { background: #fff; border-radius: 28px; padding: 24px 30px; box-shadow: 0 10px 30px rgba(75,47,176,.18);
    animation: hien .4s; }
  @keyframes hien { from { transform: scale(.7); opacity: 0; } }
  .theTu .e { font-size: 110px; animation: nhun .6s infinite alternate; }
  .theTu .chuCD { font-size: 70px; }
  .phienAm { font-size: 22px; color: #766F91; margin: 6px 0; }
  .nghia { font-size: 24px; font-weight: 700; color: var(--chinh-dam); }
  .dem { color: var(--chinh-dam); font-weight: 700; padding: 14px; text-align: center; }

  /* ----- màn chơi ----- */
  #canh { position: relative; flex: 0 0 52%; background: linear-gradient(#7fd3ff, #d9f3ff); overflow: hidden; }
  .may { position: absolute; font-size: 44px; opacity: .9; animation: troi linear infinite; }
  @keyframes troi { from { transform: translateX(560px); } to { transform: translateX(-120px); } }
  #dat { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: #6bcf5f;
    border-top: 8px solid #3fa83a; }
  #dat::after { content: ""; position: absolute; left: 0; right: 0; top: 14px; bottom: 0;
    background: repeating-linear-gradient(90deg, #8a5a2b 0 40px, #9b6a38 40px 80px); }
  #dat.chay::after { animation: lan .5s linear infinite; }
  @keyframes lan { to { background-position: -80px 0; } }
  #nam { position: absolute; left: 12%; bottom: 20%; font-size: 64px; line-height: 1; z-index: 3; transition: transform .1s; }
  #nam.nhay { animation: nhay .85s ease-out; }
  @keyframes nhay { 0% { transform: translateY(0) scaleY(.8); } 35% { transform: translateY(-120px) rotate(-12deg); }
    70% { transform: translateY(-120px) rotate(10deg); } 100% { transform: translateY(0) rotate(0); } }
  #nam.oi { animation: oi .5s; }
  @keyframes oi { 30% { transform: translateX(-24px) rotate(-20deg); } 100% { transform: translateX(0); } }
  #vat { position: absolute; bottom: 20%; z-index: 2; }
  /* quái vật chữ */
  .quai { position: relative; padding: 22px 16px 10px; background: #8e44ad; border-radius: 40px 40px 18px 18px;
    border: 4px solid #5b2a72; box-shadow: 0 6px 0 #5b2a72; }
  .quai .chuCD { font-size: 38px; }
  .quai .mat { position: absolute; top: -4px; left: 0; right: 0; text-align: center; font-size: 22px; }
  .quai::before, .quai::after { content: ""; position: absolute; top: -14px; width: 0; height: 0;
    border: 9px solid transparent; border-bottom: 18px solid #5b2a72; }
  .quai::before { left: 18px; } .quai::after { right: 18px; }
  .quai.bep { animation: bep .4s forwards; }
  @keyframes bep { to { transform: scaleY(.2) scaleX(1.3); opacity: .3; } }
  /* gai chữ */
  .gai { display: flex; align-items: flex-end; gap: 2px; }
  .gai .cay { width: 46px; height: 58px; position: relative; text-align: center; }
  .gai .cay::before { content: ""; position: absolute; left: 0; bottom: 0; border-left: 23px solid transparent;
    border-right: 23px solid transparent; border-bottom: 58px solid #e74c3c; filter: drop-shadow(0 3px 0 #922); }
  .gai .cay b { position: relative; font-family: "Baloo 2", sans-serif; font-size: 28px; color: #fff; top: 18px;
    text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .lacLu { animation: lac .35s; }
  @keyframes lac { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  #loiBinh { position: absolute; left: 50%; top: 10px; transform: translateX(-50%) scale(0); z-index: 5; max-width: 90%;
    background: #fff; border: 3px solid var(--vang); border-radius: 18px; padding: 8px 14px; font-weight: 700;
    font-size: 17px; text-align: center; transition: transform .2s; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
  #loiBinh.hien { transform: translateX(-50%) scale(1); }
  #thoiGian { position: absolute; left: 12px; right: 12px; top: auto; bottom: 6px; height: 10px; border-radius: 6px;
    background: rgba(0,0,0,.25); z-index: 4; overflow: hidden; }
  #thoiGian i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2BB673, #FFB800, #E5484D); }
  #combo { position: absolute; right: 12px; top: 10px; font-family: "Baloo 2"; font-weight: 800; font-size: 26px;
    color: #ff6a00; text-shadow: 0 2px 0 #fff; z-index: 4; }
  #tien { position: absolute; left: 12px; top: 10px; font-family: "Baloo 2"; font-weight: 800; font-size: 20px;
    color: var(--chinh-dam); background: rgba(255,255,255,.8); padding: 2px 10px; border-radius: 12px; z-index: 4; }
  #bangChon { flex: 1; display: flex; flex-direction: column; padding: 10px 12px 14px; gap: 8px; background: var(--chinh-nhat); }
  #nghe { align-self: center; }
  #luoi { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chon { border: 0; border-radius: 22px; background: #fff; font-size: 64px; box-shadow: 0 6px 0 #cfc3f5; cursor: pointer;
    transition: transform .1s; }
  .chon:active { transform: translateY(4px); box-shadow: 0 2px 0 #cfc3f5; }
  .chon.dung { background: #c9f5de; box-shadow: 0 6px 0 var(--xanh); animation: phong .5s; }
  .chon.sai { background: #eee; opacity: .45; animation: lac .35s; }
  @keyframes phong { 50% { transform: scale(1.18); } }

  /* ----- kết quả ----- */
  #manKQ { background: linear-gradient(#ffe9a8, #FAF8FF); }
  .sao { font-size: 60px; letter-spacing: 6px; }
  .dsTu { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 14px 0; }
  .dsTu div { background: #fff; border-radius: 14px; padding: 6px 12px; font-weight: 700; box-shadow: 0 3px 0 #e0d8f8; }
  .banThu { font-size: 14px; color: #766F91; margin: 8px 0 16px; }
  .roi { position: absolute; top: -40px; font-size: 30px; animation: roiXuong 2.2s linear forwards; pointer-events: none; z-index: 9; }
  @keyframes roiXuong { to { transform: translateY(900px) rotate(360deg); } }
</style>
</head>
<body>
<div id="app">

  <!-- MÀN ĐẦU -->
  <section id="manDau" class="man hien">
    <div class="giua">
      <div class="nhanBe">🍄</div>
      <h1>Săn Từ Tiếng Anh</h1>
      <p class="chuTo" style="font-size:22px;margin:8px 0 22px">Nghe thật kỹ, bấm thật nhanh,<br>nấm nhảy qua mọi quái vật!</p>
      <button class="nut vang" id="nutBatDau">🚀 Bắt đầu</button>
      <p class="banThu">Bản chơi thử • Nhớ bật loa nhé 🔊</p>
    </div>
  </section>

  <!-- MÀN LÀM QUEN -->
  <section id="manHoc" class="man">
    <div class="dem" id="demHoc"></div>
    <div class="giua">
      <div class="theTu" id="theTu"></div>
      <div style="margin-top:22px;display:flex;gap:12px;justify-content:center">
        <button class="nut nho" id="nutNgheLai">🔊 Nghe lại</button>
        <button class="nut nho vang" id="nutTiepHoc">➡ Tiếp</button>
      </div>
    </div>
  </section>

  <!-- MÀN CHƠI -->
  <section id="manChoi" class="man">
    <div id="canh">
      <div id="tien">⭐ 0/5</div><div id="combo"></div>
      <div id="loiBinh"></div>
      <div id="nam">🍄</div>
      <div id="vat"></div>
      <div id="dat"></div>
      <div id="thoiGian"><i></i></div>
    </div>
    <div id="bangChon">
      <button class="nut nho" id="nghe">🔊 Nghe lại từ</button>
      <div id="luoi"></div>
    </div>
  </section>

  <!-- MÀN KẾT QUẢ -->
  <section id="manKQ" class="man">
    <div class="giua">
      <h2 style="font-size:34px;margin:0;color:var(--chinh-dam)" id="kqTieuDe"></h2>
      <div class="sao" id="kqSao"></div>
      <div class="dsTu" id="kqTu"></div>
      <button class="nut" id="nutOn" style="display:none;margin-bottom:12px">🔁 Ôn lại từ chưa nhớ</button><br>
      <button class="nut vang" id="nutChoiLai">🎮 Chơi lại</button>
      <p class="banThu">Bản thử nghiệm: chưa tặng kim cương 💎</p>
    </div>
  </section>
</div>

<script>
"use strict";
/* ===== DỮ LIỆU TỪ (thêm/bớt ở đây) ===== */
const TU_HOC = [
  { en: "cat",    e: "🐱", vi: "con mèo",    pa: "/kæt/",   keu: "Meo meo!" },
  { en: "dog",    e: "🐶", vi: "con chó",    pa: "/dɔːɡ/",  keu: "Gâu gâu!" },
  { en: "fish",   e: "🐟", vi: "con cá",     pa: "/fɪʃ/",   keu: "Bơi nào!" },
  { en: "bird",   e: "🐦", vi: "con chim",   pa: "/bɜːd/",  keu: "Chíp chíp!" },
  { en: "rabbit", e: "🐰", vi: "con thỏ",    pa: "/ˈræbɪt/",keu: "Nhảy nhảy!" }
];
const TU_NHIEU = [ // hình gây nhiễu, không phải từ cần học
  { en: "lion", e: "🦁" }, { en: "cow", e: "🐮" }, { en: "pig", e: "🐷" },
  { en: "frog", e: "🐸" }, { en: "duck", e: "🦆" }
];
const MAU_CHU = ["#ffd93d", "#ff8fab", "#7ee0ff", "#b9f27c", "#ffb36b", "#d8b4fe"];
const LOI_BINH_CHUNG = [
  "Chính xác! {en} là {vi}! 🎉", "Giỏi quá! Con nhớ {en} rồi nè!", "Wow, nhanh ghê! {en} là {vi}!",
  "Tuyệt vời! {en} = {vi} ⭐"
];
const LOI_COMBO = { 2: "2 từ liên tiếp! 🔥", 3: "3 liên tiếp! Con đang bay! 🚀", 4: "4 liên tiếp! Siêu nấm! 💪", 5: "5 liên tiếp! Hoàn hảo! 🏆" };
const THOI_GIAN_MS = 9000;

/* ===== ÂM THANH ===== */
let ac = null;
function moAmThanh() {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch (e) {}
}
function nhac(tan, dai, kieu, to, tre) {
  if (!ac) return;
  const t = ac.currentTime + (tre || 0), o = ac.createOscillator(), g = ac.createGain();
  o.type = kieu || "sine"; o.frequency.setValueAtTime(tan, t);
  g.gain.setValueAtTime(to || 0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + dai);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dai);
}
function amTing(combo) { const c = 1 + (combo - 1) * 0.12; nhac(660 * c, .15, "triangle"); nhac(990 * c, .25, "triangle", .2, .1); }
function amBoing() {
  if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(140, t + .25);
  o.frequency.exponentialRampToValueAtTime(260, t + .4); g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.001, t + .45);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .45);
}
function amNhay() {
  if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = "square"; o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(900, t + .25);
  g.gain.setValueAtTime(.08, t); g.gain.exponentialRampToValueAtTime(.001, t + .3); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .3);
}
function amChienThang() { [523, 659, 784, 1047, 1319].forEach((f, i) => nhac(f, .3, "triangle", .2, i * .12)); }
function docTu(van, cham) {
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(van); u.lang = "en-US"; u.rate = cham ? 0.55 : 0.85; u.pitch = 1.1;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function docTuHaiLan(van) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  [0.85, 0.55].forEach(r => { const u = new SpeechSynthesisUtterance(van); u.lang = "en-US"; u.rate = r; u.pitch = 1.1; speechSynthesis.speak(u); });
}

/* ===== TIỆN ÍCH ===== */
const $ = id => document.getElementById(id);
function hienMan(id) { document.querySelectorAll(".man").forEach(m => m.classList.toggle("hien", m.id === id)); }
function tron(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function chuCachDieu(tu) { return '<span class="chuCD">' + [...tu.toUpperCase()].map((c, i) => `<span style="color:${MAU_CHU[i % MAU_CHU.length]}">${c}</span>`).join("") + "</span>"; }
function chuTrenNen(tu) { return '<span class="chuCD">' + [...tu.toUpperCase()].map((c, i) => `<span style="color:${MAU_CHU[i % MAU_CHU.length]}">${c}</span>`).join("") + "</span>"; }

/* ===== MÀN LÀM QUEN ===== */
let dsHoc = [], iHoc = 0;
function batDauHoc(ds) { dsHoc = ds; iHoc = 0; hienMan("manHoc"); veThe(); }
function veThe() {
  const t = dsHoc[iHoc];
  $("demHoc").textContent = `Làm quen từ mới ${iHoc + 1}/${dsHoc.length}`;
  $("theTu").innerHTML = `<div class="e">${t.e}</div>${chuTrenNen(t.en)}<div class="phienAm">${t.pa}</div><div class="nghia">${t.vi}</div>`;
  $("theTu").style.animation = "none"; void $("theTu").offsetWidth; $("theTu").style.animation = "";
  amTing(1); docTuHaiLan(t.en);
}
$("nutNgheLai").onclick = () => docTuHaiLan(dsHoc[iHoc].en);
$("nutTiepHoc").onclick = () => { if (++iHoc >= dsHoc.length) batDauChoi(dsHoc); else veThe(); };

/* ===== MÀN CHƠI ===== */
let dsChoi = [], iChoi = 0, combo = 0, ketQua = [], sai = 0, khoa = false, tienDo = 0, raf = 0, tBatDau = 0;
function batDauChoi(ds) {
  dsChoi = ds; iChoi = 0; combo = 0; ketQua = ds.map(() => ({ dungLanDau: true })); hienMan("manChoi");
  $("combo").textContent = ""; dauVong();
}
function dauVong() {
  const t = dsChoi[iChoi]; sai = 0; khoa = false;
  $("tien").textContent = `⭐ ${iChoi}/${dsChoi.length}`;
  $("loiBinh").classList.remove("hien");
  // vật cản: xen kẽ quái vật / gai (đều là chữ của từ cần học)
  const vat = $("vat"); vat.className = "";
  vat.innerHTML = iChoi % 2 === 0
    ? `<div class="quai"><div class="mat">👀</div>${chuCachDieu(t.en)}</div>`
    : `<div class="gai">${[...t.en.toUpperCase()].map(c => `<div class="cay"><b>${c}</b></div>`).join("")}</div>`;
  // 4 lựa chọn: 1 đúng + 3 hình gây nhiễu
  const khac = tron(TU_HOC.filter(x => x.en !== t.en).concat(TU_NHIEU)).slice(0, 3);
  const luaChon = tron([t].concat(khac));
  const luoi = $("luoi"); luoi.innerHTML = "";
  luaChon.forEach(x => {
    const b = document.createElement("button"); b.className = "chon"; b.textContent = x.e; b.dataset.en = x.en;
    b.onclick = () => bam(b, x.en === t.en); luoi.appendChild(b);
  });
  $("dat").classList.add("chay"); datViTri(0); tBatDau = performance.now(); tienDo = 0;
  setTimeout(() => docTu(t.en), 350);
  cancelAnimationFrame(raf); raf = requestAnimationFrame(chayVat);
}
function viTriX(p) { const rong = $("canh").clientWidth; return rong + 10 - p * (rong - 0.42 * rong); } // từ mép phải đến ~42%
function datViTri(p) { $("vat").style.left = viTriX(p) + "px"; $("thoiGian").firstElementChild.style.width = (p * 100) + "%"; }
function chayVat(now) {
  if (khoa) return;
  tienDo = Math.min(1, (now - tBatDau) / THOI_GIAN_MS); datViTri(tienDo);
  if (tienDo >= 1) return hetGio();
  raf = requestAnimationFrame(chayVat);
}
function hetGio() { // chạm nhẹ: không phạt, đọc lại và cho thêm thời gian
  khoa = true; combo = 0; $("combo").textContent = ""; amBoing();
  $("nam").classList.remove("oi"); void $("nam").offsetWidth; $("nam").classList.add("oi");
  noiLoi("Nghe lại nào, con làm được! 🎧"); docTu(dsChoi[iChoi].en);
  setTimeout(() => { khoa = false; tBatDau = performance.now() - THOI_GIAN_MS * 0.4; raf = requestAnimationFrame(chayVat); }, 1300);
}
function noiLoi(van) { const l = $("loiBinh"); l.textContent = van; l.classList.add("hien"); }
$("nghe").onclick = () => { moAmThanh(); docTu(dsChoi[iChoi].en); };

function bam(nut, dung) {
  if (khoa || nut.classList.contains("sai")) return; moAmThanh(); const t = dsChoi[iChoi];
  if (!dung) {
    sai++; ketQua[iChoi].dungLanDau = false; combo = 0; $("combo").textContent = "";
    nut.classList.add("sai"); amBoing(); $("vat").classList.remove("lacLu"); void $("vat").offsetWidth; $("vat").classList.add("lacLu");
    noiLoi("Gần rồi! Nghe lại nhé 🎧"); docTu(t.en);
    tBatDau = Math.max(tBatDau, performance.now() - THOI_GIAN_MS * Math.max(0, tienDo - 0.25)); // lùi quái vật một chút
    return;
  }
  khoa = true; cancelAnimationFrame(raf); nut.classList.add("dung");
  combo = ketQua[iChoi].dungLanDau ? combo + 1 : 0; amTing(Math.max(1, combo));
  $("combo").textContent = combo >= 2 ? `🔥 x${combo}` : "";
  const mau = LOI_BINH_CHUNG[(Math.random() * LOI_BINH_CHUNG.length) | 0];
  let loi = (combo >= 2 && LOI_COMBO[Math.min(combo, 5)]) ? LOI_COMBO[Math.min(combo, 5)] : mau;
  noiLoi(loi.replace(/\{en\}/g, t.en.toUpperCase()).replace("{vi}", t.vi));
  setTimeout(() => { docTu(t.en + "!"); }, 250);
  // nấm nhảy qua, vật cản trượt về sau
  const nam = $("nam"); nam.classList.remove("nhay"); void nam.offsetWidth; nam.classList.add("nhay"); amNhay();
  const vat = $("vat"), x0 = parseFloat(vat.style.left) || viTriX(tienDo), x1 = -$("vat").offsetWidth - 20, t0 = performance.now(), D = 900;
  const quai = vat.querySelector(".quai");
  (function troi(now) {
    const k = Math.min(1, (now - t0) / D); vat.style.left = (x0 + (x1 - x0) * k) + "px";
    if (quai && k > .35) quai.classList.add("bep");
    if (k < 1) requestAnimationFrame(troi);
  })(t0);
  setTimeout(() => { iChoi++; if (iChoi >= dsChoi.length) ketThuc(); else dauVong(); }, 1700);
}

/* ===== KẾT QUẢ ===== */
function ketThuc() {
  $("dat").classList.remove("chay"); amChienThang(); hienMan("manKQ");
  const nho = ketQua.filter(k => k.dungLanDau).length, n = dsChoi.length;
  const sao = nho >= n ? 3 : nho >= n - 2 ? 2 : 1;
  $("kqTieuDe").textContent = nho >= n ? "Siêu nấm! 🏆" : "Con nhớ " + nho + "/" + n + " từ!";
  $("kqSao").textContent = "⭐".repeat(sao) + "☆".repeat(3 - sao);
  $("kqTu").innerHTML = dsChoi.map((t, i) => `<div>${t.e} ${t.en} ${ketQua[i].dungLanDau ? "✅" : "🔁"}</div>`).join("");
  const chuaNho = dsChoi.filter((t, i) => !ketQua[i].dungLanDau);
  $("nutOn").style.display = chuaNho.length ? "inline-block" : "none"; $("nutOn").onclick = () => batDauHoc(chuaNho);
  phaoHoa();
}
function phaoHoa() {
  const app = $("app");
  for (let i = 0; i < 26; i++) {
    const s = document.createElement("div"); s.className = "roi"; s.textContent = ["💎", "⭐", "🎉", "✨"][i % 4];
    s.style.left = (Math.random() * 95) + "%"; s.style.animationDelay = (Math.random() * 1.2) + "s"; app.appendChild(s);
    setTimeout(() => s.remove(), 4000);
  }
}
$("nutChoiLai").onclick = () => batDauHoc(TU_HOC);
$("nutBatDau").onclick = () => { moAmThanh(); batDauHoc(TU_HOC); };
// Nạp sẵn giọng đọc (một số trình duyệt nạp muộn)
if ("speechSynthesis" in window) speechSynthesis.getVoices();
for (let i = 0; i < 4; i++) { const m = document.createElement("div"); m.className = "may"; m.textContent = "☁️";
  m.style.top = (8 + i * 16) + "%"; m.style.animationDuration = (22 + i * 7) + "s"; m.style.animationDelay = (-i * 6) + "s"; $("canh").prepend(m); }
</script>
